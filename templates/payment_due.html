<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Due - Access Blocked</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #f8fafc;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .blocked-card {
      max-width: 500px;
      padding: 40px;
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
      background: white;
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      background-color: #fee2e2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
    }
    .icon-wrapper i {
      font-size: 40px;
      color: #dc2626;
    }
  </style>
</head>
<body>
  <div class="blocked-card">
    <div class="icon-wrapper">
      <i class="fas fa-lock"></i>
    </div>
    <h2 class="fw-bold mb-3">Access Suspended</h2>
    <p class="text-muted mb-4">Your company's account has been temporarily suspended due to an outstanding payment or an administrative block.</p>
    <p class="mb-4">Please contact support or your account manager to reactivate your system access.</p>
    <a href="/login" class="btn btn-primary w-100 fw-bold">Return to Login</a>
  </div>
</body>
</html>
