{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Control Panel</h2>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">System Configuration</div>
        <div class="card-body">
            <h5 class="card-title">Warranty Enabling Panel</h5>
            <p class="card-text">Manage system configurations and control accounts.</p>

            <form method="POST" action="/control_panel">
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="warrantyToggle" name="warranty_enabled"
                           {% if warranty_enabled %}checked{% endif %}>
                    <label class="form-check-label fw-bold" for="warrantyToggle">Enable Warranty Feature</label>
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
