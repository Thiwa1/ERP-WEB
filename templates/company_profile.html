{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row mb-4">
        <div class="col-12 text-white p-3 rounded shadow-sm" style="background-color: var(--secondary-color);">
            <h4 class="mb-0 text-center fw-bold"><i class="fas fa-building me-2"></i> SETUP THE COMPANY PROFILE</h4>
        </div>
    </div>

    <form method="POST" action="{{ url_for('company_profile') }}" enctype="multipart/form-data">
        <div class="row">
            <!-- Left Panel: Form Fields -->
            <div class="col-md-8">
                <div class="card shadow-sm mb-4 border-0">
                    <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
                        <i class="fas fa-info-circle me-2"></i> Company Information
                    </div>
                    <div class="card-body bg-white">
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Company Name</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="company_name" value="{{ company.company_name }}" required>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Address No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="address_no" value="{{ company.company_addras_1 }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">City</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="city" value="{{ company.company_addras_2 }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Province</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="province" value="{{ company.company_addras_3 }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Country</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="country" value="{{ company.company_addras_4 }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Postal Code</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="postal_code" value="{{ company.company_addras_5 }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Land No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="land_no" value="{{ company.company_land_line }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Fax No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="fax_no" value="{{ company.company_fax_line }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">VAT No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="vat_no" value="{{ company.company_vate_code }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Currency Symbol</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="currency" value="{{ company.company_curency }}" style="width: 140px;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Logo Section -->
            <div class="col-md-4">
                <div class="card shadow-sm mb-4 border-0">
                    <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
                        <i class="fas fa-image me-2"></i> Company Logo
                    </div>
                    <div class="card-body bg-white text-center">
                        <div class="border rounded p-2 mb-3 bg-light d-flex align-items-center justify-content-center" style="height: 180px;">
                            {% if company.company_log %}
                            <img src="data:image/jpeg;base64,{{ company.company_log }}" alt="Company Logo" class="img-fluid" style="max-height: 100%;">
                            {% else %}
                            <span class="text-muted">No Logo</span>
                            {% endif %}
                        </div>
                        <div class="mb-3">
                            <input class="form-control" type="file" name="logo" accept="image/jpeg, image/png">
                        </div>
                        <p class="small text-muted">Recommended: 300x300px PNG with transparent background</p>
                    </div>
                </div>

                <!-- Footer Actions -->
                <div class="card shadow-sm border-0">
                    <div class="card-body d-grid">
                        <button type="submit" class="btn btn-primary fw-bold py-2 shadow-sm" style="background-color: var(--accent-color); border: none;">
                            <i class="fas fa-save me-2"></i> Submit Company Details
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
