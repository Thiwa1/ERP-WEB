{% extends "base.html" %}

{% block content %}
<style>
  .ii-icon { width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    color:#fff;background:linear-gradient(135deg,#0078D4,#005a9e);flex-shrink:0; }
  .ii-card { border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);background:#fff; }
  .ii-head { background:#f8f9fa;border-bottom:1px solid #e2e8f0;padding:.6rem 1.1rem;font-size:.72rem;
    font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#605E5C; }
  .num { font-family:'JetBrains Mono','Courier New',monospace;text-align:right; }
  #itemsTable td { vertical-align:middle; }
</style>

<div class="container-fluid py-3">
  <div class="d-flex align-items-center gap-3 mb-4">
    <div class="ii-icon"><i class="fas fa-dolly"></i></div>
    <div>
      <h5 class="mb-0 fw-bold">Inventory Issue</h5>
      <small class="text-muted">Issue stock to a cost account (Dr cost account, Cr Inventory)</small>
    </div>
    <a href="/inventory_issue/report" class="btn btn-outline-secondary ms-auto"><i class="fas fa-chart-column me-1"></i> Issue Report</a>
  </div>

  <form method="POST" action="/inventory_issue/submit" id="issueForm">
    <div class="row g-3">
      <!-- Left: items -->
      <div class="col-lg-8">
        <div class="ii-card">
          <div class="ii-head d-flex align-items-center">
            <span><i class="fas fa-boxes me-2"></i>Items to Issue</span>
            <button type="button" class="btn btn-sm btn-outline-success ms-auto" onclick="addRow()"><i class="fas fa-plus me-1"></i>Add Item</button>
          </div>
          <div class="table-responsive">
            <table class="table table-sm mb-0" id="itemsTable">
              <thead>
                <tr style="font-size:.7rem;text-transform:uppercase;color:#605E5C;">
                  <th style="width:26%;">Item</th>
                  <th class="text-end" style="width:12%;">Available</th>
                  <th class="text-end" style="width:11%;">Qty</th>
                  <th class="text-end" style="width:14%;">Balance After</th>
                  <th class="text-end" style="width:15%;">Unit Cost</th>
                  <th class="text-end" style="width:18%;">Line Value</th>
                  <th style="width:4%;"></th>
                </tr>
              </thead>
              <tbody id="itemsBody"></tbody>
              <tfoot>
                <tr>
                  <td colspan="5" class="text-end fw-bold">Total Value</td>
                  <td class="num fw-bold" id="grandTotal" style="font-size:1rem;color:#0078D4;">0.00</td>
                  <td></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      </div>

      <!-- Right: issue details -->
      <div class="col-lg-4">
        <div class="ii-card">
          <div class="ii-head"><i class="fas fa-sliders me-2"></i>Issue Details</div>
          <div class="p-3">
            <label class="form-label small fw-bold">Date</label>
            <input type="date" name="issue_date" class="form-control form-control-sm mb-3" value="{{ today_date }}" required>

            <label class="form-label small fw-bold">Source Location <span class="text-danger">*</span></label>
            <select name="source_location" class="form-select form-select-sm mb-3" required>
              <option value="">Select location</option>
              {% for loc in locations %}<option value="{{ loc.inventory_locations_name }}">{{ loc.inventory_locations_name }}</option>{% endfor %}
            </select>

            <label class="form-label small fw-bold">Cost Account (Dr) <span class="text-danger">*</span></label>
            <select name="cost_account" class="form-select form-select-sm mb-1" required>
              <option value="">Select cost account</option>
              {% for a in accounts %}<option value="{{ a.account_name }}">{{ a.account_name }}</option>{% endfor %}
            </select>
            <div class="form-text mb-3">Inventory is credited automatically.</div>

            <label class="form-label small fw-bold">Job (optional)</label>
            <select name="job_no" class="form-select form-select-sm mb-3">
              <option value="">— none —</option>
              {% for j in jobs %}<option value="{{ j.job_number }}">{{ j.job_number }}</option>{% endfor %}
            </select>

            <label class="form-label small fw-bold">Narration</label>
            <textarea name="narration" class="form-control form-control-sm mb-3" rows="2" placeholder="Reason / reference"></textarea>

            <button type="submit" class="btn w-100 py-2" style="background:linear-gradient(135deg,#0078D4,#005a9e);border:none;border-radius:8px;font-weight:600;color:#fff;">
              <i class="fas fa-dolly me-2"></i>ISSUE STOCK
            </button>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>

<script>
const II_ITEMS = [
  {% for it in items %}{name:{{ it.name|tojson }},code:{{ (it.code or '')|tojson }},unit:{{ (it.unit or '')|tojson }},cost:{{ it.cost or 0 }},stock:{{ it.stock or 0 }}},{% endfor %}
];

function itemOptions(){
  return '<option value="">Select item</option>' +
    II_ITEMS.map((x,i)=>`<option value="${i}">${x.name}${x.code?' ('+x.code+')':''}</option>`).join('');
}

function addRow(){
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <select class="form-select form-select-sm ii-item" onchange="pickItem(this)">${itemOptions()}</select>
      <input type="hidden" name="item_name[]"><input type="hidden" name="item_code[]"><input type="hidden" name="item_unit[]">
    </td>
    <td class="num ii-avail text-muted">—</td>
    <td><input type="number" step="0.001" min="0" class="form-control form-control-sm num ii-qty" name="qty[]" oninput="recalc()"></td>
    <td class="num ii-balafter fw-semibold">—</td>
    <td><input type="number" step="0.01" min="0" class="form-control form-control-sm num ii-cost" name="unit_cost[]" oninput="recalc()"></td>
    <td class="num ii-line fw-semibold">0.00</td>
    <td><button type="button" class="btn btn-sm btn-link text-danger p-0" onclick="this.closest('tr').remove();recalc();"><i class="fas fa-times"></i></button></td>`;
  document.getElementById('itemsBody').appendChild(tr);
}

function pickItem(sel){
  const tr = sel.closest('tr');
  const it = II_ITEMS[sel.value];
  tr.querySelector('[name="item_name[]"]').value = it ? it.name : '';
  tr.querySelector('[name="item_code[]"]').value = it ? it.code : '';
  tr.querySelector('[name="item_unit[]"]').value = it ? it.unit : '';
  if (it && !tr.querySelector('.ii-cost').value) tr.querySelector('.ii-cost').value = it.cost || 0;
  // Remember this item's current stock on hand (as of page load) so we can
  // show it immediately and use it to compute "Balance After" while typing qty.
  tr.dataset.stock = it ? (it.stock || 0) : '';
  const availCell = tr.querySelector('.ii-avail');
  if (it) {
    availCell.textContent = (it.stock || 0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) + (it.unit ? ' ' + it.unit : '');
    availCell.classList.toggle('text-danger', (it.stock || 0) <= 0);
    availCell.classList.toggle('text-muted', (it.stock || 0) > 0);
  } else {
    availCell.textContent = '—';
    availCell.classList.remove('text-danger');
    availCell.classList.add('text-muted');
  }
  recalc();
}

function recalc(){
  let grand = 0;
  document.querySelectorAll('#itemsBody tr').forEach(tr => {
    const qty = parseFloat(tr.querySelector('.ii-qty').value) || 0;
    const cost = parseFloat(tr.querySelector('.ii-cost').value) || 0;
    const line = qty * cost;
    tr.querySelector('.ii-line').textContent = line.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
    grand += line;

    // Balance After = current stock on hand minus the qty being issued on this row
    const balCell = tr.querySelector('.ii-balafter');
    const hasStock = tr.dataset.stock !== undefined && tr.dataset.stock !== '';
    if (hasStock && qty > 0) {
      const stock = parseFloat(tr.dataset.stock) || 0;
      const balAfter = stock - qty;
      balCell.textContent = balAfter.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
      balCell.classList.toggle('text-danger', balAfter < 0);
      balCell.classList.toggle('text-success', balAfter >= 0);
    } else {
      balCell.textContent = '—';
      balCell.classList.remove('text-danger','text-success');
    }
  });
  document.getElementById('grandTotal').textContent = grand.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}

document.getElementById('issueForm').onsubmit = function(e){
  const names = [...document.querySelectorAll('[name="item_name[]"]')].filter(i=>i.value);
  if (names.length === 0){ e.preventDefault(); alert('Add at least one item to issue.'); return false; }
};

addRow();
</script>
{% endblock %}
