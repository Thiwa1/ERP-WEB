{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">

    <!-- Page Header -->
    <div class="d-flex align-items-center gap-3 mb-4">
        <div style="width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#0078D4,#005FA3);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <i class="fas fa-print text-white" style="font-size:.95rem;"></i>
        </div>
        <div>
            <h5 class="mb-0" style="color:#1a1a2e;font-weight:700;">Cheque Print Setup</h5>
            <div style="font-size:.7rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#605E5C;">Banking</div>
        </div>
    </div>

    <form method="POST" action="{{ url_for('cheque_print_setup') }}">
        <div class="row g-4">

            <!-- Left: Settings Form -->
            <div class="col-md-4">
                <div style="border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.07);background:#fff;overflow:hidden;height:100%;">
                    <div style="padding:14px 18px;border-bottom:1px solid #e2e8f0;background:#f8f9fa;">
                        <div style="font-size:.7rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#605E5C;">Configuration</div>
                    </div>
                    <div class="p-3">

                        <!-- Bank Account -->
                        <div class="mb-4">
                            <label style="font-size:.8rem;font-weight:600;color:#323130;" class="form-label">Bank Account</label>
                            <select class="form-select form-select-sm" name="bank_account" id="bankSelect"
                                    onchange="window.location.href='/cheque_print_setup?bank_account=' + this.value"
                                    style="border-radius:8px;border:1px solid #e2e8f0;">
                                <option value="">Default (All Accounts)</option>
                                {% for acc in bank_accounts %}
                                <option value="{{ acc.bank_bookcol_account_number }}" {% if selected_bank == acc.bank_bookcol_account_number %}selected{% endif %}>{{ acc.bank_bookcol_account_number }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Paper Size -->
                        <div style="font-size:.7rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#605E5C;margin-bottom:8px;">Paper Size (mm)</div>
                        <div class="row g-2 mb-4">
                            <div class="col-6">
                                <label style="font-size:.8rem;font-weight:600;color:#323130;" class="form-label">Width</label>
                                <input type="number" class="form-control form-control-sm" name="paper_width" id="paperWidth"
                                       step="0.1" value="{{ settings.paper_width_mm or 175 }}" oninput="updatePreview()"
                                       style="border-radius:8px;border:1px solid #e2e8f0;">
                            </div>
                            <div class="col-6">
                                <label style="font-size:.8rem;font-weight:600;color:#323130;" class="form-label">Height</label>
                                <input type="number" class="form-control form-control-sm" name="paper_height" id="paperHeight"
                                       step="0.1" value="{{ settings.paper_height_mm or 76 }}" oninput="updatePreview()"
                                       style="border-radius:8px;border:1px solid #e2e8f0;">
                            </div>
                        </div>

                        <!-- Coordinates -->
                        <div style="font-size:.7rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#605E5C;margin-bottom:8px;">Coordinates (mm) &amp; Font (pt)</div>

                        <!-- Column headers -->
                        <div class="row g-2 mb-1">
                            <div class="col-4"></div>
                            <div class="col-3"><span style="font-size:.68rem;color:#605E5C;font-weight:600;">X</span></div>
                            <div class="col-3"><span style="font-size:.68rem;color:#605E5C;font-weight:600;">Y</span></div>
                            <div class="col-2"><span style="font-size:.68rem;color:#605E5C;font-weight:600;">Sz</span></div>
                        </div>

                        <!-- Date -->
                        <div class="row g-2 mb-2 align-items-center">
                            <div class="col-4"><label style="font-size:.8rem;font-weight:600;color:#323130;" class="mb-0">Date</label></div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="date_x" id="dateX" placeholder="X" step="0.1" value="{{ settings.date_x or 140 }}" oninput="updatePreview()" style="border-radius:6px;border:1px solid #e2e8f0;">
                            </div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="date_y" id="dateY" placeholder="Y" step="0.1" value="{{ settings.date_y or 10 }}" oninput="updatePreview()" style="border-radius:6px;border:1px solid #e2e8f0;">
                            </div>
                            <div class="col-2">
                                <input type="number" class="form-control form-control-sm" name="date_fs" id="dateFS" placeholder="Sz" value="{{ settings.date_font_size or 10 }}" oninput="updatePreview()" style="border-radius:6px;border:1px solid #e2e8f0;">
                            </div>
                        </div>

                        <!-- Payee -->
                        <div class="row g-2 mb-2 align-items-center">
                            <div class="col-4"><label style="font-size:.8rem;font-weight:600;color:#323130;" class="mb-0">Payee</label></div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="payee_x" id="payeeX" placeholder="X" step="0.1" value="{{ settings.payee_x or 20 }}" oninput="updatePreview()" style="border-radius:6px;border:1px solid #e2e8f0;">
                            </div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="payee_y" id="payeeY" placeholder="Y" step="0.1" value="{{ settings.payee_y or 25 }}" oninput="updatePreview()" style="border-radius:6px;border:1px solid #e2e8f0;">
                            </div>
                            <div class="col-2">
                                <input type="number" class="form-control form-control-sm" name="payee_fs" id="payeeFS" placeholder="Sz" value="{{ settings.payee_font_size or 11 }}" oninput="updatePreview()" style="border-radius:6px;border:1px solid #e2e8f0;">
                            </div>
                        </div>

                        <!-- Words -->
                        <div class="row g-2 mb-2 align-items-center">
                            <div class="col-4"><label style="font-size:.8rem;font-weight:600;color:#323130;" class="mb-0">Amt (Words)</label></div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="words_x" id="wordsX" placeholder="X" step="0.1" value="{{ settings.amount_words_x or 25 }}" oninput="updatePreview()" style="border-radius:6px;border:1px solid #e2e8f0;">
                            </div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="words_y" id="wordsY" placeholder="Y" step="0.1" value="{{ settings.amount_words_y or 35 }}" oninput="updatePreview()" style="border-radius:6px;border:1px solid #e2e8f0;">
                            </div>
                            <div class="col-2">
                                <input type="number" class="form-control form-control-sm" name="words_fs" id="wordsFS" placeholder="Sz" value="{{ settings.amount_words_font_size or 10 }}" oninput="updatePreview()" style="border-radius:6px;border:1px solid #e2e8f0;">
                            </div>
                        </div>

                        <!-- Digits -->
                        <div class="row g-2 mb-4 align-items-center">
                            <div class="col-4"><label style="font-size:.8rem;font-weight:600;color:#323130;" class="mb-0">Amt (Digits)</label></div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="digits_x" id="digitsX" placeholder="X" step="0.1" value="{{ settings.amount_digits_x or 140 }}" oninput="updatePreview()" style="border-radius:6px;border:1px solid #e2e8f0;">
                            </div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="digits_y" id="digitsY" placeholder="Y" step="0.1" value="{{ settings.amount_digits_y or 35 }}" oninput="updatePreview()" style="border-radius:6px;border:1px solid #e2e8f0;">
                            </div>
                            <div class="col-2">
                                <input type="number" class="form-control form-control-sm" name="digits_fs" id="digitsFS" placeholder="Sz" value="{{ settings.amount_digits_font_size or 12 }}" oninput="updatePreview()" style="border-radius:6px;border:1px solid #e2e8f0;">
                            </div>
                        </div>

                        <!-- Options -->
                        <div style="font-size:.7rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#605E5C;margin-bottom:8px;">Options</div>
                        <div class="mb-4 p-3" style="background:#f8f9fa;border-radius:8px;border:1px solid #e2e8f0;">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="is_cross" id="isCross"
                                       {% if settings.is_cross_cheque %}checked{% endif %} onchange="updatePreview()">
                                <label class="form-check-label" style="font-size:.82rem;font-weight:600;color:#323130;">Print "A/C Payee Only"</label>
                            </div>
                        </div>

                        <button type="submit" class="btn w-100 d-flex align-items-center justify-content-center gap-2"
                                style="background:linear-gradient(135deg,#0078D4,#005FA3);border:none;border-radius:8px;color:#fff;font-weight:600;padding:10px 0;font-size:.88rem;">
                            <i class="fas fa-save"></i> Save Configuration
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right: Preview -->
            <div class="col-md-8">
                <div style="border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.07);background:#fff;overflow:hidden;height:100%;">
                    <div style="padding:14px 18px;border-bottom:1px solid #e2e8f0;background:#f8f9fa;display:flex;align-items:center;gap:8px;">
                        <div style="font-size:.7rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#605E5C;">Layout Preview (Scaled)</div>
                    </div>
                    <div class="d-flex justify-content-center align-items-center p-4" style="background:#2d2d2d;min-height:280px;">
                        <!-- Cheque Canvas -->
                        <div id="chequePreview" style="background-color:white;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.6);border-radius:4px;">
                            <div id="prevDate" class="preview-element">DD/MM/YYYY</div>
                            <div id="prevPayee" class="preview-element">Payee Name Here</div>
                            <div id="prevWords" class="preview-element">One Thousand Rupees Only</div>
                            <div id="prevDigits" class="preview-element">1,000.00</div>
                            <div id="prevCross" class="preview-element" style="border-top:1px solid #000;border-bottom:1px solid #000;transform:rotate(-45deg);font-size:10px;text-align:center;width:80px;">A/C PAYEE ONLY</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </form>
</div>

<script>
    function updatePreview() {
        // 1mm = approx 3.78px
        const scale = 3.78;

        const width = parseFloat(document.getElementById('paperWidth').value) || 175;
        const height = parseFloat(document.getElementById('paperHeight').value) || 76;

        const preview = document.getElementById('chequePreview');
        preview.style.width = (width * scale) + 'px';
        preview.style.height = (height * scale) + 'px';

        // Helper to position
        function setPos(elId, xId, yId, fsId) {
            const el = document.getElementById(elId);
            const x = parseFloat(document.getElementById(xId).value) || 0;
            const y = parseFloat(document.getElementById(yId).value) || 0;
            const fs = parseFloat(document.getElementById(fsId).value) || 10;

            el.style.left = (x * scale) + 'px';
            el.style.top = (y * scale) + 'px';
            el.style.fontSize = (fs * 1.3) + 'px'; // pt to px approx
            el.style.position = 'absolute';
        }

        setPos('prevDate', 'dateX', 'dateY', 'dateFS');
        setPos('prevPayee', 'payeeX', 'payeeY', 'payeeFS');
        setPos('prevWords', 'wordsX', 'wordsY', 'wordsFS');
        setPos('prevDigits', 'digitsX', 'digitsY', 'digitsFS');

        // Cross Cheque
        const cross = document.getElementById('prevCross');
        const isCross = document.getElementById('isCross').checked;
        cross.style.display = isCross ? 'block' : 'none';
        cross.style.left = '20px'; // Fixed relative pos usually
        cross.style.top = '20px';
    }

    // Init
    window.onload = updatePreview;
</script>
{% endblock %}
