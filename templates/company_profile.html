{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <div class="d-flex align-items-center mb-4">
    <h4 class="mb-0 fw-bold text-dark"><i class="text-success fas fa-building me-2"></i> Setup The Company Profile</h4>
</div>

    <form method="POST" action="{{ url_for('company_profile') }}" enctype="multipart/form-data">
        <div class="row">
            <!-- Left Panel: Form Fields -->
            <div class="col-md-8">
                <div class="card shadow-sm mb-4 border-0">
                    <div class="card-header text-primary fw-bold bg-transparent border-0 pb-0 pt-4" >
                        <i class="fas fa-info-circle me-2"></i> Company Information
                    </div>
                    <div class="card-body bg-white">
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold">Company Name</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="company_name" value="{{ company.company_name }}" required>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold">Address No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="address_no" value="{{ company.company_addras_1 }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold">City</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="city" value="{{ company.company_addras_2 }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold">Province</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="province" value="{{ company.company_addras_3 }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold">Country</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="country" value="{{ company.company_addras_4 }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold">Postal Code</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="postal_code" value="{{ company.company_addras_5 }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold">Land No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="land_no" value="{{ company.company_land_line }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold">Fax No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="fax_no" value="{{ company.company_fax_line }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold">VAT No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="vat_no" value="{{ company.company_vate_code }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold">Currency Symbol</label>
                            <div class="col-sm-8">
                                <select class="form-select fw-bold" name="currency" required>
                                    <option value="" disabled>Select Currency</option>
                                    {% for curr in currencies %}
                                    <option value="{{ curr.currency_code }}" {% if company.company_curency == curr.currency_code %}selected{% endif %}>
                                        {{ curr.currency_code }} - {{ curr.currency_name }}
                                    </option>
                                    {% endfor %}
                                </select>
                                <div class="form-text text-muted small">System-wide currency symbol (e.g., LKR, USD, EUR)</div>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold">VAT Registered</label>
                            <div class="col-sm-8 d-flex align-items-center">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" name="vat_registered" id="vatRegistered" {% if company.vat_registered == 1 %}checked{% endif %}>
                                    <label class="form-check-label" for="vatRegistered">Company is VAT Registered</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Logo Section -->
            <div class="col-md-4">
                <div class="card shadow-sm mb-4 border-0">
                    <div class="card-header text-primary fw-bold bg-transparent border-0 pb-0 pt-4" >
                        <i class="fas fa-image me-2"></i> Company Logo
                    </div>
                    <div class="card-body bg-white text-center">
                        <div class="border rounded p-2 mb-3 bg-light d-flex align-items-center justify-content-center" style="height: 180px;">
                            {% if company.company_log %}
                            <img src="data:image/jpeg;base64,{{ company.company_log }}" alt="Company Logo" class="img-fluid" style="max-height: 100%;">
                            {% else %}
                            <span class="text-muted">No Logo</span>
                            {% endif %}
                        </div>
                        <div class="mb-3">
                            <input class="form-control" type="file" name="logo" accept="image/jpeg, image/png">
                        </div>
                        <p class="small text-muted">Recommended: 300x300px PNG with transparent background</p>
                    </div>
                </div>

                <!-- Footer Actions -->
                <div class="card shadow-sm border-0">
                    <div class="card-body d-grid">
                        <button type="submit" class="btn btn-primary fw-bold py-2 shadow-sm" style="background-color: var(--accent-color); border: none;">
                            <i class="fas fa-save me-2"></i> Submit Company Details
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
