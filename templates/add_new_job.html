{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row mb-4">
        <div class="col-12 text-white p-3 rounded shadow-sm" style="background-color: var(--secondary-color);">
            <h4 class="mb-0 text-center fw-bold"><i class="fas fa-briefcase me-2"></i> ADD NEW JOB</h4>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
                    <i class="fas fa-info-circle me-2"></i> Job Details
                </div>
                <div class="card-body bg-white">
                    <form method="POST" action="{{ url_for('create_job') }}">
                        <div class="mb-3 row">
                            <label class="col-sm-3 col-form-label fw-bold" style="color: var(--primary-color);">Job No</label>
                            <div class="col-sm-9">
                                <input type="number" class="form-control" name="job_no" required placeholder="Enter Job Number">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-3 col-form-label fw-bold" style="color: var(--primary-color);">Job Description</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" name="job_description" required placeholder="Enter Job Description">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end mt-4">
                            <button type="submit" class="btn btn-primary fw-bold px-5 shadow-sm" style="background-color: var(--accent-color); border: none;">
                                <i class="fas fa-save me-2"></i> Create New Job
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
