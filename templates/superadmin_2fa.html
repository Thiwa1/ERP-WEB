<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Admin 2FA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
  <div class="card p-4 shadow-sm" style="width: 350px;">
    <h4 class="text-center mb-4">SMS Verification</h4>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form action="/superadmin_verify" method="POST">
      <div class="mb-3">
        <label>Enter OTP sent to your phone</label>
        <input type="text" name="otp" class="form-control text-center fs-4" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Verify</button>
    </form>
  </div>
</body>
</html>
