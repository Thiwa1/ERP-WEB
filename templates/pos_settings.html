{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row mb-4">
        <div class="col-12 text-white p-3 rounded shadow-sm" style="background-color: var(--secondary-color);">
            <h4 class="mb-0 text-center fw-bold"><i class="fas fa-cogs me-2"></i> POS SETTINGS</h4>
        </div>
    </div>

    <form method="POST" action="/pos_settings">
        <div class="row">
            <!-- General Settings -->
            <div class="col-md-6">
                <div class="card shadow-sm mb-4 border-0">
                    <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
                        <i class="fas fa-sliders-h me-2"></i> General Configuration
                    </div>
                    <div class="card-body bg-white">
                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Inventory Location</label>
                            <select name="location" class="form-select">
                                <option value="">-- Select --</option>
                                {% for loc in locations %}
                                <option value="{{ loc.inventory_locations_name }}" {% if settings.Select_Inventry_Location == loc.inventory_locations_name %}selected{% endif %}>
                                    {{ loc.inventory_locations_name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Credit Card Control Account</label>
                            <select name="card_ac" class="form-select">
                                <option value="">-- Select --</option>
                                {% for acc in accounts %}
                                <option value="{{ acc.account_name }}" {% if settings.Card_Control_AC == acc.account_name %}selected{% endif %}>
                                    {{ acc.account_name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Cash Control Account</label>
                            <select name="cash_ac" class="form-select">
                                <option value="">-- Select --</option>
                                {% for acc in accounts %}
                                <option value="{{ acc.account_name }}" {% if settings.Cash_Account == acc.account_name %}selected{% endif %}>
                                    {{ acc.account_name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pricing & VAT -->
            <div class="col-md-6">
                <div class="card shadow-sm mb-4 border-0">
                    <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
                        <i class="fas fa-tags me-2"></i> Pricing & VAT
                    </div>
                    <div class="card-body bg-white">
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" name="market_price" id="marketPrice" {% if settings.Sales_with_market_price == 1 %}checked{% endif %}>
                            <label class="form-check-label fw-bold" style="color: var(--primary-color);" for="marketPrice">Sales with Market Price</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" name="special_price" id="specialPrice" {% if settings.Sales_with_Special_price == 1 %}checked{% endif %}>
                            <label class="form-check-label fw-bold" style="color: var(--primary-color);" for="specialPrice">Sales with Special Price</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" name="loyalty_price" id="loyaltyPrice" {% if settings.Loyalty_Price == 1 %}checked{% endif %}>
                            <label class="form-check-label fw-bold" style="color: var(--primary-color);" for="loyaltyPrice">Loyalty Price Enabled</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" name="vat_enable" id="vatEnable" {% if settings.VAT_Enable == 1 %}checked{% endif %}>
                            <label class="form-check-label fw-bold" style="color: var(--primary-color);" for="vatEnable">VAT Enabled</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Messages -->
            <div class="col-md-12">
                <div class="card shadow-sm mb-4 border-0">
                    <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
                        <i class="fas fa-comment-alt me-2"></i> Receipt Messages
                    </div>
                    <div class="card-body bg-white">
                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Top Message</label>
                            <textarea name="top_msg" class="form-control" rows="2">{{ settings.Top_Message }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Footer Message</label>
                            <textarea name="footer_msg" class="form-control" rows="3">{{ settings.Footer_Message }}</textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" style="background-color: var(--accent-color); border: none;">
            <i class="fas fa-save me-2"></i> SAVE SETTINGS
        </button>
    </form>
</div>
{% endblock %}
