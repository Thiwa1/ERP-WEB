{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">

    <!-- Page Header -->
    <div class="d-flex align-items-center gap-3 mb-4">
        <div style="width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem;box-shadow:0 4px 12px rgba(0,0,0,.15);background:linear-gradient(135deg,#5c6bc0,#3949ab);flex-shrink:0;">
            <i class="fas fa-file-contract"></i>
        </div>
        <div>
            <h5 class="mb-0 fw-bold text-dark">Add GL Account</h5>
            <div style="font-size:.78rem;" class="text-muted">Chart of Accounts</div>
        </div>
    </div>

    <form method="POST" action="{{ url_for('add_new_account') }}">

        <!-- Account Type Selection -->
        <div class="mb-4" style="border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.07);background:#fff;overflow:hidden;">
            <div class="px-4 pt-4 pb-2">
                <div style="font-size:.7rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#605E5C;" class="mb-3">
                    <i class="fas fa-check-circle me-1"></i> Select Account Type
                </div>
                <div class="d-flex justify-content-center gap-4 flex-wrap pb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="account_type" value="income" id="check_income">
                        <label class="form-check-label" style="font-size:.8rem;font-weight:600;color:#323130;" for="check_income">Income Account</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="account_type" value="expense" id="check_expense">
                        <label class="form-check-label" style="font-size:.8rem;font-weight:600;color:#323130;" for="check_expense">Expenses Account</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="account_type" value="liability" id="check_liability">
                        <label class="form-check-label" style="font-size:.8rem;font-weight:600;color:#323130;" for="check_liability">Liability Account</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="account_type" value="equity" id="check_equity">
                        <label class="form-check-label" style="font-size:.8rem;font-weight:600;color:#323130;" for="check_equity">Equity Account</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="account_type" value="asset" id="check_asset">
                        <label class="form-check-label" style="font-size:.8rem;font-weight:600;color:#323130;" for="check_asset">Assets Account</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <!-- Left Column: Account Details -->
            <div class="col-md-6">
                <div class="h-100" style="border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.07);background:#fff;overflow:hidden;">
                    <div class="px-4 pt-4 pb-2">
                        <div style="font-size:.7rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#605E5C;" class="mb-3">
                            <i class="fas fa-info-circle me-1"></i> Account Details
                        </div>
                    </div>
                    <div class="px-4 pb-4">
                        <div class="mb-3">
                            <label class="form-label" style="font-size:.8rem;font-weight:600;color:#323130;">Account Name</label>
                            <input type="text" class="form-control" name="account_name" id="accountNameInput" placeholder="Enter account name" spellcheck="true">
                            <div id="aiSuggestion" class="form-text text-success fw-bold" style="display:none;"><i class="fas fa-robot"></i> AI Suggestion: <span id="suggestionText"></span></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" style="font-size:.8rem;font-weight:600;color:#323130;">Currency</label>
                            <select class="form-select" name="currency_code">
                                {% for curr in currencies %}
                                <option value="{{ curr.currency_code }}">{{ curr.currency_code }} - {{ curr.currency_name }}</option>
                                {% endfor %}
                            </select>
                            <div class="form-text text-muted" style="font-size:.75rem;">If different from Base Currency, transactions will require exchange rates.</div>
                        </div>

                        <hr class="my-3" style="border-color:#e2e8f0;">
                        <div style="font-size:.7rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#605E5C;" class="mb-3">
                            <i class="fas fa-level-down-alt me-1"></i> Sub Account (Optional)
                        </div>

                        <div class="mb-3">
                            <label class="form-label" style="font-size:.8rem;font-weight:600;color:#323130;">Sub Account Name</label>
                            <input type="text" class="form-control" name="sub_account_name" placeholder="Enter sub account name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" style="font-size:.8rem;font-weight:600;color:#323130;">Main Account For Sub Account</label>
                            <select class="form-select" name="main_account_select">
                                <option value="">Select Main Account...</option>
                                {% for acc in existing_accounts %}
                                <option value="{{ acc.account_name }}">{{ acc.account_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Category Selection -->
            <div class="col-md-6">
                <div class="h-100" style="border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.07);background:#fff;overflow:hidden;">
                    <div class="px-4 pt-4 pb-2">
                        <div style="font-size:.7rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#605E5C;" class="mb-3">
                            <i class="fas fa-list-ul me-1"></i> Category Selection
                        </div>
                    </div>
                    <div class="px-4 pb-4">
                        <div class="mb-3">
                            <label class="form-label" style="font-size:.8rem;font-weight:600;color:#323130;">Balance Sheet Category</label>
                            <select class="form-select" name="bs_category">
                                <option value="">Please select</option>
                                {% for cat in bs_categories %}
                                <option value="{{ cat.name_of_category }},{{ cat.holding_position }}">{{ cat.name_of_category }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" style="font-size:.8rem;font-weight:600;color:#323130;">Income Category</label>
                            <select class="form-select" name="income_category">
                                <option value="">Please select</option>
                                {% for cat in pl_categories %}
                                <option value="{{ cat.name_of_category }},{{ cat.holding_position }}">{{ cat.name_of_category }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" style="font-size:.8rem;font-weight:600;color:#323130;">Cash Flow Category</label>
                            <select class="form-select" name="cf_category">
                                <option value="">-- Select Cash Flow Category --</option>
                                {% for cat in cf_categories %}
                                <option value="{{ cat.catogory_name }}">{{ cat.catogory_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Actions -->
        <div style="border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.07);background:#fff;">
            <div class="px-4 py-3 d-flex justify-content-end gap-2 flex-wrap">
                <button type="submit" name="action" value="add_account" class="btn fw-600 px-4" style="background:var(--accent-color);border:none;border-radius:8px;font-weight:600;color:#fff;">
                    <i class="fas fa-plus me-1"></i> Add New Account
                </button>
                <button type="submit" name="action" value="add_sub_account" class="btn btn-secondary fw-bold px-4" style="border-radius:8px;">
                    <i class="fas fa-level-down-alt me-1"></i> Sub Account
                </button>
                <a href="/chart_of_accounts" class="btn btn-info fw-bold px-4 text-white" style="border-radius:8px;">
                    <i class="fas fa-list me-1"></i> List Account
                </a>
                <a href="/cash_flow_categories" class="btn btn-warning fw-bold px-4 text-white" style="border-radius:8px;">
                    <i class="fas fa-tags me-1"></i> CF Category
                </a>
            </div>
        </div>
    </form>
</div>

<script>
    // Enforce mutual exclusivity for checkboxes
    const checkboxes = document.querySelectorAll('input[name="account_type"]');
    checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', function() {
            if (this.checked) {
                checkboxes.forEach(cb => {
                    if (cb !== this) cb.checked = false;
                });
            }
        });
    });

    // AI Prediction Logic
    const nameInput = document.getElementById('accountNameInput');
    const suggestionDiv = document.getElementById('aiSuggestion');
    const suggestionText = document.getElementById('suggestionText');

    nameInput.addEventListener('blur', function() {
        const name = this.value.trim();
        if (name.length < 3) return;

        fetch(`/api/predict_account_type?name=${encodeURIComponent(name)}`)
            .then(response => response.json())
            .then(data => {
                if (data.confidence > 0.75 && data.mapped_type) {
                    // Auto select checkbox
                    const targetCheckbox = document.getElementById(`check_${data.mapped_type}`);
                    if (targetCheckbox) {
                        // Uncheck others first (mutual exclusivity)
                        checkboxes.forEach(cb => cb.checked = false);

                        targetCheckbox.checked = true;

                        // Show Suggestion
                        suggestionText.innerText = `Classified as ${data.original_type} (${(data.confidence * 100).toFixed(0)}% confidence)`;
                        suggestionDiv.style.display = 'block';

                        // Flash the box
                        targetCheckbox.parentElement.classList.add('bg-warning', 'bg-opacity-25', 'rounded');
                        setTimeout(() => {
                            targetCheckbox.parentElement.classList.remove('bg-warning', 'bg-opacity-25', 'rounded');
                        }, 2000);
                    }
                } else if (data.confidence > 0) {
                     // Low confidence, just hint
                     // User instruction said "connect internet if < 75%", we just ignore or could show hint
                     suggestionDiv.style.display = 'none';
                } else {
                    suggestionDiv.style.display = 'none';
                }
            })
            .catch(err => console.error('AI Prediction Error:', err));
    });
</script>
{% endblock %}
