<!DOCTYPE html>
<html>
<head>
<script>
        function hideGlobalLoader() {
            const loader = document.getElementById('globalPageLoader');
            if (loader) {
                loader.classList.add('hidden');
                loader.style.pointerEvents = 'none';
                setTimeout(() => { loader.style.display = 'none'; }, 300);
            }
        }

        // Try multiple events to ensure it gets hidden
        document.addEventListener('DOMContentLoaded', hideGlobalLoader);
        window.addEventListener('load', hideGlobalLoader);
        // Fallback safety timeout if events don't fire properly or take too long
        setTimeout(hideGlobalLoader, 1500);
</script>
</head>
<body>
    <div id="globalPageLoader" style="position:fixed;top:0;left:0;right:0;bottom:0;background:red;"></div>
    <button>Test</button>
</body>
</html>
