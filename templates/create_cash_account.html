{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row mb-4">
        <div class="col-12 bg-primary text-white p-3 rounded">
            <h4 class="mb-0 text-center fw-bold">MANAGE THE NEW BANK ACCOUNT</h4>
        </div>
    </div>

    <form method="POST" action="{{ url_for('create_cash_account') }}">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label fw-bold text-primary">Account Number</label>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" name="account_number" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label fw-bold text-primary">Account Name</label>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" name="account_name" required>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-sm-9 offset-sm-3">
                        <button type="submit" class="btn btn-primary fw-bold px-5">Create New Bank Account</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4 bg-light">
            <div class="card-body">
                <h6 class="fw-bold text-primary mb-3">Additional Information</h6>
                <p class="text-muted mb-0">
                    Enter the bank account details above. The account will be available for transactions immediately after creation.
                </p>
            </div>
        </div>
    </form>
</div>
{% endblock %}
