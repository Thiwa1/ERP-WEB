{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="card shadow-sm">
        <div class="card-header">
            ADD NEW CUSTOMER/SUPPLIER
        </div>
        <div class="card-body">
            <form method="POST" action="/add_customer">
                <div class="row">
                    <!-- Left Panel: Basic Information -->
                    <div class="col-md-6 border-end">
                        <h5 class="text-primary mb-3">Basic Information</h5>

                        <div class="mb-3 row">
                            <label for="supplier_name" class="col-sm-4 col-form-label fw-bold">Supplier Name</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="supplier_name" name="supplier_name" required>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="salutation" class="col-sm-4 col-form-label fw-bold">Salutation</label>
                            <div class="col-sm-8 d-flex">
                                <select class="form-select me-2" id="salutation" name="salutation">
                                    {% for sal in salutations %}
                                    <option value="{{ sal }}">{{ sal }}</option>
                                    {% endfor %}
                                </select>
                                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#salutationModal">+</button>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="supplier_code" class="col-sm-4 col-form-label fw-bold">Supplier Code</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="supplier_code" name="supplier_code">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="credit_limit" class="col-sm-4 col-form-label fw-bold">Credit Limit</label>
                            <div class="col-sm-8">
                                <input type="number" step="0.01" class="form-control" id="credit_limit" name="credit_limit">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="vat_no" class="col-sm-4 col-form-label fw-bold">VAT No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="vat_no" name="vat_no">
                            </div>
                        </div>
                    </div>

                    <!-- Right Panel: Address & Contact -->
                    <div class="col-md-6">
                        <h5 class="text-primary mb-3">Address Details</h5>

                        <div class="mb-3 row">
                            <label for="address_no" class="col-sm-4 col-form-label fw-bold">Address No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="address_no" name="address_no">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="address_line_1" class="col-sm-4 col-form-label fw-bold">Address Line 01</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="address_line_1" name="address_line_1">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="address_line_2" class="col-sm-4 col-form-label fw-bold">Address Line 02</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="address_line_2" name="address_line_2">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="address_line_3" class="col-sm-4 col-form-label fw-bold">Address Line 03</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="address_line_3" name="address_line_3">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="address_line_4" class="col-sm-4 col-form-label fw-bold">Address Line 04</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="address_line_4" name="address_line_4">
                            </div>
                        </div>

                        <h5 class="text-primary mt-4 mb-3">Contact Details</h5>

                        <div class="mb-3 row">
                            <label for="contact_1" class="col-sm-4 col-form-label fw-bold">Contact No 01</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="contact_1" name="contact_1">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="contact_2" class="col-sm-4 col-form-label fw-bold">Contact No 02</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="contact_2" name="contact_2">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="email" class="col-sm-4 col-form-label fw-bold">E-Mail</label>
                            <div class="col-sm-8">
                                <input type="email" class="form-control" id="email" name="email">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <button type="submit" class="btn btn-primary px-5">Create New Customer</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal for Adding Salutation -->
<div class="modal fade" id="salutationModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Salutation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form action="/add_salutation" method="POST">
          <div class="modal-body">
            <input type="text" class="form-control" name="new_salutation" placeholder="Enter Salutation (e.g. Mr, Mrs)" required>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
