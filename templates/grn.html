{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row mb-4">
        <div class="col-12 text-white p-3 rounded shadow-sm" style="background-color: var(--secondary-color);">
            <h4 class="mb-0 text-center fw-bold"><i class="fas fa-truck-loading me-2"></i> GOODS RECEIVED NOTE MANAGEMENT</h4>
        </div>
    </div>

    <form method="POST" action="{{ url_for('grn') }}" id="grnForm">
        <div class="row">
            <!-- Left Panel: Item List -->
            <div class="col-md-7">
                <div class="card shadow-sm mb-4 border-0">
                    <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
                        <i class="fas fa-list me-2"></i> Items Added
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-bordered table-striped mb-0" id="itemsTable">
                            <thead class="table-dark">
                                <tr>
                                    <th>Item Name</th>
                                    <th>Code</th>
                                    <th>Unit</th>
                                    <th>Qty</th>
                                    <th>Cost</th>
                                    <th>Total</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Rows will be added here via JS -->
                            </tbody>
                        </table>
                        <input type="hidden" name="items_json" id="itemsJson">
                    </div>
                </div>
            </div>

            <!-- Right Panel: Controls -->
            <div class="col-md-5">
                <!-- Supplier Section -->
                <div class="card shadow-sm mb-3 border-0">
                    <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
                        <i class="fas fa-user-tag me-2"></i> Supplier Selection
                    </div>
                    <div class="card-body bg-white">
                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Supplier List</label>
                            <select class="form-select select2" name="supplier" required>
                                <option value="">Select Supplier</option>
                                {% for sup in suppliers %}
                                <option value="{{ sup.supplier_name }}">{{ sup.supplier_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-0">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Auto-Fill from PO</label>
                            <select class="form-select" id="poSelect" onchange="loadPoDetails()">
                                <option value="">Select Purchase Order</option>
                                <!-- Filled via JS -->
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Item Entry Section -->
                <div class="card shadow-sm mb-3 border-0">
                    <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
                        <i class="fas fa-plus-circle me-2"></i> Item Entry
                    </div>
                    <div class="card-body bg-white">
                        <div class="row g-2 mb-2">
                            <div class="col-md-5">
                                <label class="form-label fw-bold" style="color: var(--primary-color);">Item Name</label>
                                <select class="form-select select2" id="itemSelect">
                                    <option value="">Select Item</option>
                                    {% for item in items %}
                                    <option value="{{ item.inventoy_name }}" data-code="{{ item.inventoy_code }}" data-unit="{{ item.inventoy_items_messurment_unit }}">{{ item.inventoy_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label fw-bold" style="color: var(--primary-color);">Qty</label>
                                <input type="number" class="form-control" id="itemQty" step="0.01">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label fw-bold" style="color: var(--primary-color);">Cost</label>
                                <input type="number" class="form-control" id="itemCost" step="0.01">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold" style="color: var(--primary-color);">Total</label>
                                <input type="number" class="form-control" id="itemTotal" readonly>
                            </div>
                        </div>
                        <button type="button" class="btn btn-primary w-100 fw-bold" style="background-color: var(--accent-color); border: none;" onclick="addItem()">
                            <i class="fas fa-plus me-1"></i> Add New Row
                        </button>
                    </div>
                </div>

                <!-- Job & Location Section -->
                <div class="card shadow-sm mb-3 border-0">
                    <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
                        <i class="fas fa-map-marker-alt me-2"></i> Job & Location
                    </div>
                    <div class="card-body bg-white">
                        <div class="row g-2">
                            <div class="col-md-6">
                                <label class="form-label fw-bold" style="color: var(--primary-color);">Job No</label>
                                <select class="form-select select2" name="job_no">
                                    <option value="">Select Job</option>
                                    {% for job in jobs %}
                                    <option value="{{ job.job_number }}">{{ job.job_number }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold" style="color: var(--primary-color);">Location</label>
                                <select class="form-select select2" name="location" required>
                                    <option value="">Select Location</option>
                                    {% for loc in locations %}
                                    <option value="{{ loc.inventory_locations_name }}">{{ loc.inventory_locations_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Invoice Details Section -->
                <div class="card shadow-sm mb-3 border-0">
                    <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
                        <i class="fas fa-file-alt me-2"></i> Invoice Details
                    </div>
                    <div class="card-body bg-white">
                        <div class="row g-2 mb-2">
                            <div class="col-md-6">
                                <label class="form-label fw-bold" style="color: var(--primary-color);">Invoice No</label>
                                <input type="text" class="form-control" name="invoice_no" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold" style="color: var(--primary-color);">Date</label>
                                <input type="date" class="form-control" name="invoice_date" value="{{ today_date }}" required>
                            </div>
                        </div>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <label class="form-label fw-bold" style="color: var(--primary-color);">Due Date</label>
                                <input type="date" class="form-control" name="due_date" value="{{ today_date }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold" style="color: var(--primary-color);">J/V Narration</label>
                                <input type="text" class="form-control" name="narration" required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Totals Section -->
                <div class="card shadow-sm border-0">
                    <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
                        <i class="fas fa-calculator me-2"></i> Totals & VAT
                    </div>
                    <div class="card-body bg-white">
                        <div class="row mb-2 align-items-center">
                            <div class="col-md-4">
                                <label class="form-label fw-bold mb-0" style="color: var(--primary-color);">Total Value</label>
                            </div>
                            <div class="col-md-8">
                                <div class="input-group">
                                    <span class="input-group-text">{{ company_currency }}</span>
                                    <input type="number" class="form-control text-end" id="totalValue" name="total_value" readonly>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-2 align-items-center">
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="vatCheck" name="vat_liable" onchange="calculateTotals()">
                                    <label class="form-check-label fw-bold" style="color: var(--primary-color);" for="vatCheck">VAT Liable</label>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="input-group">
                                    <input type="number" class="form-control text-end" id="vatRate" name="vat_rate" value="0" onchange="calculateTotals()">
                                    <span class="input-group-text">%</span>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-2 align-items-center">
                            <div class="col-md-4">
                                <label class="form-label fw-bold mb-0" style="color: var(--primary-color);">VAT Amount</label>
                            </div>
                            <div class="col-md-8">
                                <div class="input-group">
                                    <span class="input-group-text">{{ company_currency }}</span>
                                    <input type="number" class="form-control text-end" id="vatAmount" name="vat_amount" readonly>
                                </div>
                            </div>
                        </div>
                        <div class="row align-items-center">
                            <div class="col-md-4">
                                <label class="form-label fw-bold mb-0" style="color: var(--primary-color);">Total Amount</label>
                            </div>
                            <div class="col-md-8">
                                <div class="input-group">
                                    <span class="input-group-text fw-bold">{{ company_currency }}</span>
                                    <input type="number" class="form-control text-end fw-bold" id="grandTotal" name="grand_total" readonly style="font-size: 1.1rem;">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-grid gap-2 mt-4 d-md-flex justify-content-md-end">
                    <button type="submit" class="btn btn-primary px-5 py-2 fw-bold shadow-sm" style="background-color: var(--accent-color); border: none;">
                        <i class="fas fa-save me-2"></i> PROCEED
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
    let items = [];

    // Calculate Item Total dynamically
    const qtyInput = document.getElementById('itemQty');
    const costInput = document.getElementById('itemCost');
    const totalInput = document.getElementById('itemTotal');

    function calcItemTotal() {
        const qty = parseFloat(qtyInput.value) || 0;
        const cost = parseFloat(costInput.value) || 0;
        totalInput.value = (qty * cost).toFixed(2);
    }

    qtyInput.addEventListener('input', calcItemTotal);
    costInput.addEventListener('input', calcItemTotal);

    function addItem() {
        const select = document.getElementById('itemSelect');
        const option = select.options[select.selectedIndex];

        if (!option.value || !qtyInput.value || !costInput.value) {
            alert("Please fill all item fields");
            return;
        }

        const item = {
            name: option.value,
            code: option.getAttribute('data-code'),
            unit: option.getAttribute('data-unit'),
            qty: parseFloat(qtyInput.value),
            cost: parseFloat(costInput.value),
            total: parseFloat(totalInput.value)
        };

        items.push(item);
        renderTable();
        calculateTotals();

        // Reset inputs
        select.value = "";
        qtyInput.value = "";
        costInput.value = "";
        totalInput.value = "";
    }

    function removeItem(index) {
        items.splice(index, 1);
        renderTable();
        calculateTotals();
    }

    function renderTable() {
        const tbody = document.querySelector('#itemsTable tbody');
        tbody.innerHTML = '';
        items.forEach((item, index) => {
            const row = `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.code}</td>
                    <td>${item.unit}</td>
                    <td>${item.qty}</td>
                    <td>${item.cost.toFixed(2)}</td>
                    <td>${item.total.toFixed(2)}</td>
                    <td class="text-center"><button type="button" class="btn btn-outline-danger btn-sm border-0" onclick="removeItem(${index})"><i class="fas fa-trash"></i></button></td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
        document.getElementById('itemsJson').value = JSON.stringify(items);
    }

    function calculateTotals() {
        const totalValue = items.reduce((sum, item) => sum + item.total, 0);
        document.getElementById('totalValue').value = totalValue.toFixed(2);

        const isVat = document.getElementById('vatCheck').checked;
        const vatRate = parseFloat(document.getElementById('vatRate').value) || 0;

        let vatAmount = 0;
        if (isVat) {
            vatAmount = (totalValue * vatRate) / 100;
        }

        document.getElementById('vatAmount').value = vatAmount.toFixed(2);
        document.getElementById('grandTotal').value = (totalValue + vatAmount).toFixed(2);
    }

    // Load PO List on Startup
    fetch('/purchase_orders/list')
        .then(r => r.json())
        .then(data => {
            const sel = document.getElementById("poSelect");
            data.forEach(po => {
                if (po.approved) {
                    const opt = document.createElement("option");
                    opt.value = po.id;
                    opt.text = `${po.po_number} - ${po.supplier}`;
                    sel.add(opt);
                }
            });
        });

    function loadPoDetails() {
        const poId = document.getElementById("poSelect").value;
        if (!poId) return;

        fetch(`/purchase_orders/get/${poId}`)
            .then(r => r.json())
            .then(data => {
                // Set Supplier
                const supSelect = document.querySelector('select[name="supplier"]');
                for(let i=0; i<supSelect.options.length; i++) {
                    if(supSelect.options[i].text === data.header.supplier) {
                        supSelect.selectedIndex = i;
                        break;
                    }
                }

                // Add Items
                // Instead of replacing, we push to the items array
                // But better to clear first if user wants to override
                if(confirm("This will clear current items. Continue?")) {
                    items = [];
                    data.items.forEach(item => {
                        items.push({
                            name: item.item,
                            code: "AUTO", // Code might not be in PO details, defaulting
                            unit: item.unit,
                            qty: parseFloat(item.qty),
                            cost: parseFloat(item.price),
                            total: parseFloat(item.qty) * parseFloat(item.price)
                        });
                    });
                    renderTable();
                    calculateTotals();
                }
            });
    }
</script>
{% endblock %}
