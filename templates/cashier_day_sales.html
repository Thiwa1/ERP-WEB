{% extends "base.html" %}
{% block content %}
<div class="container py-4">
    <div class="card shadow border-0">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="fas fa-chart-line me-2"></i> Cashier Day Sales Summary</h5>
        </div>
        <div class="card-body">
            <h6 class="text-muted">Date: {{ date }}</h6>
            <div class="row mt-4">
                <div class="col-md-6 mb-3">
                    <div class="card bg-light border-0 text-center p-4">
                        <h2 class="display-4 text-primary">{{ summary.total_invoices }}</h2>
                        <span class="text-muted text-uppercase fw-bold">Total Invoices</span>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card bg-light border-0 text-center p-4">
                        <h2 class="display-4 text-success">{{ summary.total_sales|currency }}</h2>
                        <span class="text-muted text-uppercase fw-bold">Total Sales Value</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-footer bg-white border-top-0 d-flex justify-content-end">
            <a href="/index" class="btn btn-secondary me-2">Back to Dashboard</a>
            <button onclick="window.print()" class="btn btn-primary"><i class="fas fa-print me-2"></i>Print Summary</button>
        </div>
    </div>
</div>
{% endblock %}
