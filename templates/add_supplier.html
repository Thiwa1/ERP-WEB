{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row mb-4">
        <div class="col-12 bg-primary text-white p-3 rounded">
            <h4 class="mb-0 text-center fw-bold">ADD NEW SUPPLIER</h4>
        </div>
    </div>

    <form method="POST" action="{{ url_for('add_supplier') }}">
        <div class="row">
            <!-- Setup Details -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white">
                        <h6 class="mb-0 fw-bold text-center">Setup Details</h6>
                    </div>
                    <div class="card-body">
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Supplier Name</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control bg-light" name="supplier_name" required>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Salutation</label>
                            <div class="col-sm-4">
                                <select class="form-select bg-light" name="salutation">
                                    <option value="">Select...</option>
                                    {% for sal in salutations %}
                                    <option value="{{ sal }}">{{ sal }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-sm-4">
                                <div class="input-group">
                                    <input type="text" class="form-control form-control-sm" id="newSalutation" placeholder="New">
                                    <button class="btn btn-secondary btn-sm" type="button" onclick="addSalutation()">Add</button>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Supplier Code</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control bg-light" name="supplier_code" required>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">VAT No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control bg-light" name="vat_no">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Credit Limit</label>
                            <div class="col-sm-8">
                                <input type="number" class="form-control bg-light" name="credit_limit" step="0.01">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Contact Details -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white">
                        <h6 class="mb-0 fw-bold text-center">Contact Details</h6>
                    </div>
                    <div class="card-body">
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Address No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control bg-light" name="address_no">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Address Line 01</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control bg-light" name="address_line_1">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Address Line 02</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control bg-light" name="address_line_2">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Address Line 03</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control bg-light" name="address_line_3">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Address Line 04</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control bg-light" name="address_line_4">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Contact No 01</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control bg-light" name="contact_1">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Contact No 02</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control bg-light" name="contact_2">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">E-Mail</label>
                            <div class="col-sm-8">
                                <input type="email" class="form-control bg-light" name="email">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="card shadow-sm">
            <div class="card-body d-flex justify-content-end align-items-center">
                <button type="submit" class="btn btn-primary px-5 fw-bold">CREATE NEW SUPPLIER</button>
            </div>
        </div>
    </form>
</div>

<script>
    function addSalutation() {
        const newVal = document.getElementById('newSalutation').value;
        if (!newVal) return;

        const formData = new FormData();
        formData.append('new_salutation', newVal);
        formData.append('redirect_url', window.location.pathname); // Tell backend where to return

        fetch('/add_salutation_ajax', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                location.reload();
            } else {
                alert('Error adding salutation');
            }
        });
    }
</script>
{% endblock %}
