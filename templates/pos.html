{% extends "base.html" %}

{% block content %}
<style>
    /* Hide the sidebar and top navbar for the POS page */
    .sidebar, .top-navbar {
        display: none !important;
    }

    /* Make the main content use full width and remove margin */
    .main-content {
        margin-left: 0 !important;
        padding: 0 !important;
    }
</style>

<!-- New Loyalty Customer Modal -->
<div class="modal fade" id="newCustomerModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header text-white" style="background-color: #2C3E50;">
                <h5 class="modal-title fw-bold"><i class="fas fa-user-plus me-2"></i> Registration of Loyalty Customer</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4 bg-light">
                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: #2C3E50;">Customer Name</label>
                    <input type="text" class="form-control" id="newCustName" placeholder="Enter name">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: #2C3E50;">Billing Address</label>
                    <input type="text" class="form-control" id="newCustBillAddr" placeholder="Enter billing address">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: #2C3E50;">Delivery Address</label>
                    <input type="text" class="form-control" id="newCustDelAddr" placeholder="Enter delivery address">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: #2C3E50;">E-Mail</label>
                    <input type="email" class="form-control" id="newCustEmail" placeholder="Enter email">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: #2C3E50;">Mobile No</label>
                    <input type="text" class="form-control" id="newCustMobile" placeholder="Enter mobile number">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: #2C3E50;">Amount Paid</label>
                    <input type="number" class="form-control" id="newCustAmount" placeholder="0.00" value="0">
                </div>
                <div class="d-grid mt-4">
                    <button type="button" class="btn fw-bold" style="background-color: #3498DB; color: white;" onclick="submitNewCustomer()">Submit</button>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- Price Selection Modal -->
<div class="modal fade" id="priceSelectModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title fw-bold"><i class="fas fa-tags me-2"></i> Select Price Variation</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <div class="list-group list-group-flush" id="priceVariationList">
                    <!-- Dynamic Variations Injected Here -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Main POS Interface -->

<div class="container-fluid py-3" id="posInterface">

    <!-- Top Bar -->
    <div class="row mb-3 align-items-center bg-white p-2 rounded shadow-sm mx-0">
        <div class="col-md-4">
            <h4 class="mb-0 fw-bold" style="color: var(--primary-color);">POINT OF SALE</h4>
        </div>
        <div class="col-md-4 text-center">
            <span class="badge bg-success fs-6" id="posStatus">ONLINE</span>
            <span class="ms-2 fw-bold" id="clock"></span>
        </div>
        <div class="col-md-4 text-end">
            <button class="btn btn-warning btn-sm fw-bold me-2" onclick="showPricing()">
                <i class="fas fa-tags"></i> PRICES
            </button>
            <button class="btn btn-secondary btn-sm fw-bold me-2" onclick="location.reload()">
                <i class="fas fa-sync"></i> RESET
            </button>
            <button class="btn btn-danger btn-sm fw-bold" onclick="location.href='/'">
                <i class="fas fa-times"></i> EXIT
            </button>
        </div>
    </div>

    <div class="row h-100">
        <!-- Left: Cart -->
        <div class="col-md-8">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body p-0 d-flex flex-column">
                    <!-- Item Input -->
                    <div class="p-3 bg-light border-bottom">
                        <div class="row g-2">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Scan Item / Code</label>
                                <input type="text" class="form-control form-control-lg fw-bold" id="itemInput" placeholder="Scan or Type..." autocomplete="off">
                                <div id="itemSuggestions" class="list-group position-absolute w-50" style="z-index: 1000; display:none;"></div>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label fw-bold">Qty</label>
                                <input type="number" class="form-control form-control-lg fw-bold text-center" id="itemQty" value="1">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label fw-bold">Price</label>
                                <input type="number" class="form-control form-control-lg fw-bold text-end" id="itemPrice" readonly>
                            </div>
                            <div class="col-md-2 d-grid">
                                <label class="form-label text-white">.</label>
                                <button class="btn btn-primary fw-bold" onclick="addItemToCart()">ADD</button>
                            </div>
                        </div>
                        <div class="mt-2 text-muted small">
                            <i class="fas fa-info-circle"></i> Item Name: <span id="itemNameDisplay" class="fw-bold text-dark">-</span>
                        </div>
                    </div>

                    <!-- Cart Table -->
                    <div class="table-responsive flex-grow-1" style="max-height: 450px; overflow-y: auto;">
                        <table class="table table-striped table-hover mb-0" id="cartTable">
                            <thead class="table-dark sticky-top">
                                <tr>
                                    <th>Code</th>
                                    <th>Item Name</th>
                                    <th>Qty</th>
                                    <th>Price</th>
                                    <th>Total</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Totals & Payment -->
        <div class="col-md-4">
            <div class="card h-100 shadow-sm border-0" style="background-color: var(--primary-color);">
                <div class="card-body text-white d-flex flex-column p-2">
                    <!-- Customer Info -->
                    <div class="mb-2 p-2 bg-white bg-opacity-10 rounded">
                        <label class="small text-uppercase text-light opacity-75 fw-bold">Customer (Loyalty)</label>
                        <div class="input-group">
                            <input type="text" class="form-control border-0 fw-bold" id="customerPhone" placeholder="Mobile Number" onblur="checkLoyalty()">
                            <button class="btn btn-light" type="button" onclick="checkLoyalty()"><i class="fas fa-search"></i></button>
                            <button class="btn btn-success" type="button" data-bs-toggle="modal" data-bs-target="#newCustomerModal" title="Add New Customer"><i class="fas fa-user-plus"></i></button>
                        </div>
                        <div id="customerName" class="mt-1 fw-bold text-warning small">-</div>
                    </div>

                    <!-- Totals Display -->
                    <div class="flex-grow-1 d-flex flex-column justify-content-center text-center">
                        <div class="mb-1 opacity-75">TOTAL AMOUNT</div>
                        <div class="display-4 fw-bold" id="grandTotal">0.00</div>
                        <div class="mt-1 text-warning fw-bold" id="savingsDisplay" style="display:none;">
                            YOU SAVED: <span id="totalSavings">0.00</span>
                        </div>
                    </div>

                    <!-- Number Pad -->
                    <div class="bg-white p-2 rounded text-dark mt-2 mb-2">
                        <div class="row g-1 mb-1">
                            <div class="col-4"><button class="btn btn-outline-secondary w-100 py-2 fs-5 fw-bold" onclick="insertNumber('1')">1</button></div>
                            <div class="col-4"><button class="btn btn-outline-secondary w-100 py-2 fs-5 fw-bold" onclick="insertNumber('2')">2</button></div>
                            <div class="col-4"><button class="btn btn-outline-secondary w-100 py-2 fs-5 fw-bold" onclick="insertNumber('3')">3</button></div>
                        </div>
                        <div class="row g-1 mb-1">
                            <div class="col-4"><button class="btn btn-outline-secondary w-100 py-2 fs-5 fw-bold" onclick="insertNumber('4')">4</button></div>
                            <div class="col-4"><button class="btn btn-outline-secondary w-100 py-2 fs-5 fw-bold" onclick="insertNumber('5')">5</button></div>
                            <div class="col-4"><button class="btn btn-outline-secondary w-100 py-2 fs-5 fw-bold" onclick="insertNumber('6')">6</button></div>
                        </div>
                        <div class="row g-1 mb-1">
                            <div class="col-4"><button class="btn btn-outline-secondary w-100 py-2 fs-5 fw-bold" onclick="insertNumber('7')">7</button></div>
                            <div class="col-4"><button class="btn btn-outline-secondary w-100 py-2 fs-5 fw-bold" onclick="insertNumber('8')">8</button></div>
                            <div class="col-4"><button class="btn btn-outline-secondary w-100 py-2 fs-5 fw-bold" onclick="insertNumber('9')">9</button></div>
                        </div>
                        <div class="row g-1">
                            <div class="col-4"><button class="btn btn-danger w-100 py-2 fw-bold" onclick="handleClear()">C</button></div>
                            <div class="col-4"><button class="btn btn-outline-secondary w-100 py-2 fs-5 fw-bold" onclick="insertNumber('0')">0</button></div>
                            <div class="col-4"><button class="btn btn-warning w-100 py-2 fw-bold" onclick="handleBackspace()"><i class="fas fa-backspace"></i></button></div>
                        </div>
                        <div class="row g-1 mt-1">
                            <div class="col-12"><button class="btn btn-primary w-100 py-2 fw-bold" onclick="handleEnter()">ENTER</button></div>
                        </div>
                    </div>

                    <!-- Payment Actions -->
                    <div class="bg-white p-2 rounded text-dark">
                        <!-- Quick Cash -->
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="fw-bold small">Cash Paid</label>
                                <input type="number" class="form-control fw-bold text-end" id="cashPaid" placeholder="0.00" oninput="calcChange()">
                            </div>
                            <div class="col-6">
                                <label class="fw-bold small">Change</label>
                                <input type="text" class="form-control fw-bold text-end text-danger" id="changeDue" readonly value="0.00">
                            </div>
                        </div>

                        <!-- Pay Buttons -->
                        <div class="row g-2">
                            <div class="col-6">
                                <button class="btn btn-success w-100 py-2 fw-bold" onclick="processPayment(1)">
                                    <i class="fas fa-money-bill-wave me-1"></i> CASH
                                </button>
                            </div>
                            <div class="col-6">
                                <button class="btn btn-info text-white w-100 py-2 fw-bold" onclick="processPayment(2)">
                                    <i class="fas fa-credit-card me-1"></i> CARD
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script>
    // --- Global State ---
    let posSettings = {};
    let itemsCache = [];
    let customersCache = [];
    let cart = [];
    let currentItem = null;
    let loyaltyCustomer = null;
    let lastFocusedInput = null;

    // --- Startup ---
    document.addEventListener('DOMContentLoaded', () => {
        // Fetch POS settings automatically since the user is already logged into the system
        fetch('/api/pos/settings')
            .then(r => r.json())
            .then(data => {
                if(data.success) {
                    posSettings = data.settings;
                    loadCache(); // Load Items/Customers
                    document.getElementById('itemInput').focus();
                } else {
                    alert("Failed to load POS Settings: " + data.error);
                }
            });

        // Start Clock
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // Track active input for Numpad
        document.querySelectorAll('input[type="text"], input[type="number"]').forEach(input => {
            input.addEventListener('focus', () => {
                lastFocusedInput = input;
            });
        });
        lastFocusedInput = document.getElementById('itemInput');
    });

    // --- 1. Numpad Logic ---
    function insertNumber(num) {
        if (!lastFocusedInput) lastFocusedInput = document.getElementById('itemInput');

        // Use standard append for number inputs (selectionStart throws an error on input type="number" in some browsers)
        if (lastFocusedInput.type === 'number') {
            lastFocusedInput.value = lastFocusedInput.value + num;
        } else {
            const start = lastFocusedInput.selectionStart;
            const end = lastFocusedInput.selectionEnd;
            const val = lastFocusedInput.value;

            lastFocusedInput.value = val.substring(0, start) + num + val.substring(end);
            lastFocusedInput.selectionStart = lastFocusedInput.selectionEnd = start + 1;
        }
        lastFocusedInput.focus();

        // Trigger input event
        lastFocusedInput.dispatchEvent(new Event('input'));
    }

    function handleBackspace() {
        if (!lastFocusedInput) return;

        if (lastFocusedInput.type === 'number') {
             lastFocusedInput.value = lastFocusedInput.value.slice(0, -1);
        } else {
            const start = lastFocusedInput.selectionStart;
            const val = lastFocusedInput.value;

            if (start > 0) {
                lastFocusedInput.value = val.substring(0, start - 1) + val.substring(start);
                lastFocusedInput.selectionStart = lastFocusedInput.selectionEnd = start - 1;
            }
        }
        lastFocusedInput.dispatchEvent(new Event('input'));
        lastFocusedInput.focus();
    }

    function handleClear() {
        if (!lastFocusedInput) return;
        lastFocusedInput.value = '';
        lastFocusedInput.dispatchEvent(new Event('input'));
        lastFocusedInput.focus();
    }

    function handleEnter() {
        if (!lastFocusedInput) return;

        if (lastFocusedInput.id === 'itemInput' || lastFocusedInput.id === 'itemQty') {
            addItemToCart();
        } else if (lastFocusedInput.id === 'cashPaid') {
            processPayment(1); // Default to Cash
        } else {
            // Move focus to next logical element
            const inputs = ['itemInput', 'itemQty', 'customerPhone', 'cashPaid'];
            const idx = inputs.indexOf(lastFocusedInput.id);
            if (idx > -1 && idx < inputs.length - 1) {
                document.getElementById(inputs[idx + 1]).focus();
            }
        }
    }

    function submitNewCustomer() {
        const name = document.getElementById('newCustName').value;
        const mobile = document.getElementById('newCustMobile').value;
        const email = document.getElementById('newCustEmail').value;
        const billing_address = document.getElementById('newCustBillAddr').value;
        const delivery_address = document.getElementById('newCustDelAddr').value;
        const amount_paid = document.getElementById('newCustAmount').value || 0;

        if (!name || !mobile) {
            alert('Name and Mobile Number are required.');
            return;
        }

        const payload = {
            name: name,
            mobile: mobile,
            email: email,
            billing_address: billing_address,
            delivery_address: delivery_address,
            amount_paid: parseFloat(amount_paid)
        };

        fetch('/api/pos/add_loyalty_customer', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                alert("Customer created successfully!");
                // Add to cache
                customersCache.push(data.customer);

                // Auto-select the new customer
                document.getElementById('customerPhone').value = data.customer.mobile;
                checkLoyalty();

                // Close modal
                bootstrap.Modal.getInstance(document.getElementById('newCustomerModal')).hide();

                // Clear form
                document.getElementById('newCustName').value = '';
                document.getElementById('newCustMobile').value = '';
                document.getElementById('newCustEmail').value = '';
                document.getElementById('newCustBillAddr').value = '';
                document.getElementById('newCustDelAddr').value = '';
                document.getElementById('newCustAmount').value = '0';

                document.getElementById('itemInput').focus();
            } else {
                alert("Error creating customer: " + data.error);
            }
        });
    }

    // --- 2. Client-Side Caching ---
    function loadCache() {
        // Load Items
        fetch('/api/pos/items').then(r => r.json()).then(data => {
            itemsCache = data;
            console.log("Items Cached:", itemsCache.length);
        });

        // Load Customers
        fetch('/api/pos/customers').then(r => r.json()).then(data => {
            customersCache = data;
            console.log("Customers Cached:", customersCache.length);
        });
    }

    // --- 3. Item Search & Selection ---
    const itemInput = document.getElementById('itemInput');
    const suggestions = document.getElementById('itemSuggestions');

    itemInput.addEventListener('input', function() {
        const val = this.value.toLowerCase();
        if(val.length < 2) { suggestions.style.display='none'; return; }

        const matches = itemsCache.filter(i =>
            i.code.toLowerCase().includes(val) ||
            i.name.toLowerCase().includes(val)
        );

        // Group by code to show unique suggestions
        const uniqueMatches = [];
        const seenCodes = new Set();
        for (const m of matches) {
            if (!seenCodes.has(m.code)) {
                seenCodes.add(m.code);
                uniqueMatches.push(m);
            }
        }

        const displayMatches = uniqueMatches.slice(0, 10);

        suggestions.innerHTML = '';
        if(displayMatches.length > 0) {
            suggestions.style.display = 'block';
            displayMatches.forEach(item => {
                const a = document.createElement('a');
                a.className = 'list-group-item list-group-item-action fw-bold';
                a.innerHTML = `${item.name} <span class="badge bg-secondary float-end">${item.code}</span>`;
                a.onclick = () => {
                    // Check if there are other variations for this selected code
                    const variations = itemsCache.filter(i => i.code === item.code);
                    if(variations.length > 1) {
                        showPriceVariations(variations);
                    } else {
                        selectItem(item);
                        // don't auto add to cart for suggestions so user can adjust qty
                    }
                };
                suggestions.appendChild(a);
            });
        } else {
            suggestions.style.display = 'none';
        }
    });



    // Handle Barcode Scan (Enter key)
    itemInput.addEventListener('keypress', function(e) {
        if(e.key === 'Enter') {
            const val = this.value.toLowerCase();
            const matches = itemsCache.filter(i => i.code.toLowerCase() === val || (i.batch_code && i.batch_code.toLowerCase() === val));

            if(matches.length === 1) {
                selectItem(matches[0]);
                addItemToCart();
            } else if(matches.length > 1) {
                showPriceVariations(matches);
            }
        }
    });

    function showPriceVariations(matches) {
        const list = document.getElementById('priceVariationList');
        list.innerHTML = '';

        matches.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3';

            // Format what to display
            let activePrice = item.price_market;
            if(posSettings.loyalty_active === 1 && loyaltyCustomer) activePrice = item.price_loyalty;
            else if(posSettings.special_active === 1) activePrice = item.price_special;
            else if(posSettings.market_active === 1) activePrice = item.price_market;

            btn.innerHTML = `
                <div>
                    <h6 class="mb-0 fw-bold text-primary">${item.name}</h6>
                    <small class="text-muted">Cost: ${item.cost.toFixed(2)} | Code: ${item.code}</small>
                </div>
                <span class="badge bg-success rounded-pill fs-6">${activePrice.toFixed(2)}</span>
            `;

            btn.onclick = () => {
                bootstrap.Modal.getInstance(document.getElementById('priceSelectModal')).hide();
                selectItem(item);
                addItemToCart();
            };

            list.appendChild(btn);
        });

        new bootstrap.Modal(document.getElementById('priceSelectModal')).show();
    }

    function selectItem(item) {

        currentItem = item;
        document.getElementById('itemInput').value = item.code;
        document.getElementById('itemNameDisplay').innerText = item.name;
        suggestions.style.display = 'none';

        // Pricing Logic (Matching C# logic)
        let price = item.price_market; // Default

        if(posSettings.loyalty_active === 1 && loyaltyCustomer) {
            price = item.price_loyalty;
        } else if (posSettings.special_active === 1) {
            price = item.price_special;
        } else if (posSettings.market_active === 1) {
            price = item.price_market;
        }

        document.getElementById('itemPrice').value = price.toFixed(2);
        document.getElementById('itemQty').focus();
    }

    // --- 4. Cart Management ---
    function addItemToCart() {
        if(!currentItem) return alert("Select item first");

        const qty = parseFloat(document.getElementById('itemQty').value) || 1;
        const price = parseFloat(document.getElementById('itemPrice').value) || 0;

        cart.push({
            ...currentItem,
            qty: qty,
            price: price, // The active price used
            total: qty * price
        });

        renderCart();

        // Reset Inputs
        currentItem = null;
        document.getElementById('itemInput').value = '';
        document.getElementById('itemQty').value = 1;
        document.getElementById('itemPrice').value = '';
        document.getElementById('itemNameDisplay').innerText = '-';
        document.getElementById('itemInput').focus();
    }

    function renderCart() {
        const tbody = document.querySelector('#cartTable tbody');
        tbody.innerHTML = '';
        let total = 0;
        let savings = 0;

        cart.forEach((item, idx) => {
            total += item.total;

            // Calculate Savings (Market Price - Active Price)
            const saving = (item.price_market - item.price) * item.qty;
            if(saving > 0) savings += saving;

            tbody.innerHTML += `
                <tr>
                    <td>${item.code}</td>
                    <td>${item.name}</td>
                    <td class="text-center">${item.qty}</td>
                    <td class="text-end">${item.price.toFixed(2)}</td>
                    <td class="text-end fw-bold">${item.total.toFixed(2)}</td>
                    <td class="text-center"><button class="btn btn-sm btn-danger py-0" onclick="removeFromCart(${idx})">X</button></td>
                </tr>
            `;
        });

        document.getElementById('grandTotal').innerText = total.toFixed(2);

        if(savings > 0) {
            document.getElementById('savingsDisplay').style.display = 'block';
            document.getElementById('totalSavings').innerText = savings.toFixed(2);
        } else {
            document.getElementById('savingsDisplay').style.display = 'none';
        }
    }

    function removeFromCart(idx) {
        cart.splice(idx, 1);
        renderCart();
    }


    function recalculateCartPrices() {
        cart.forEach(item => {
            let newPrice = item.price_market;
            if (posSettings.loyalty_active === 1 && loyaltyCustomer) {
                newPrice = item.price_loyalty;
            } else if (posSettings.special_active === 1) {
                newPrice = item.price_special;
            }
            item.price = newPrice;
            item.total = item.qty * newPrice;
        });
        renderCart();
    }

    // --- 5. Customer Loyalty ---
    function checkLoyalty() {
        const mobile = document.getElementById('customerPhone').value;
        const nameDisplay = document.getElementById('customerName');

        if(mobile.length > 9) {
            const cust = customersCache.find(c => c.mobile === mobile);
            if(cust) {
                loyaltyCustomer = cust;
                nameDisplay.innerText = cust.name;
                nameDisplay.className = "mt-1 fw-bold text-success small";
                // Optionally show a non-intrusive toast instead of alert
                // alert(`Loyalty Customer Identified: ${cust.name}`);
            } else {
                loyaltyCustomer = null;
                nameDisplay.innerText = "Not Found";
                nameDisplay.className = "mt-1 fw-bold text-danger small";
            }
        } else {
            loyaltyCustomer = null;
            nameDisplay.innerText = "-";
            nameDisplay.className = "mt-1 fw-bold text-warning small";
        }
    }

    // --- 6. Payment & Submission ---
    function calcChange() {
        const total = parseFloat(document.getElementById('grandTotal').innerText);
        const paid = parseFloat(document.getElementById('cashPaid').value) || 0;
        document.getElementById('changeDue').value = (paid - total).toFixed(2);
    }

    function processPayment(method) {
        if(cart.length === 0) return alert("Cart is empty");

        const total = parseFloat(document.getElementById('grandTotal').innerText);
        const cashPaid = parseFloat(document.getElementById('cashPaid').value) || 0;

        if(method === 1 && cashPaid < total) return alert("Insufficient Cash");

        const payload = {
            cart: cart,
            payment: {
                method: method, // 1=Cash, 2=Card
                amount_paid: cashPaid,
                change: cashPaid - total
            },
            customer: loyaltyCustomer ? {
                loyalty_no: loyaltyCustomer.mobile,
                name: loyaltyCustomer.name
            } : {},
            settings: posSettings
        };

        fetch('/pos/submit_sale', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(res => {
            if(res.success) {
                // Print Receipt Logic (Simplified alert/redirect)
                if(confirm("Transaction Successful! Print Receipt?")) {
                    window.open(`/pos_receipt/${res.jv}`, '_blank');
                }
                // Reset
                cart = [];
                loyaltyCustomer = null;
                renderCart();
                document.getElementById('cashPaid').value = '';
                document.getElementById('changeDue').value = '0.00';
                document.getElementById('customerPhone').value = '';
                document.getElementById('customerName').innerText = '-';
            } else {
                alert("Transaction Failed: " + res.error);
            }
        });
    }
</script>
{% endblock %}
