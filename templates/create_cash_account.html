{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row mb-4">
        <div class="col-12 text-dark p-3 rounded shadow-sm" style="background-color: var(--secondary-color);">
            <h4 class="mb-0 text-center fw-bold"><i class="fas fa-wallet me-2"></i> CREATE NEW CASH ACCOUNT</h4>
        </div>
    </div>

    <form method="POST" action="{{ url_for('create_cash_account') }}">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm mb-4 border-0">
                    <div class="card-header fw-bold text-dark" style="background-color: var(--secondary-color);">
                        <i class="fas fa-info-circle me-2"></i> Account Details
                    </div>
                    <div class="card-body bg-white">
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Account Name</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="account_name" required placeholder="e.g. Petty Cash">
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary fw-bold py-2 shadow-sm" style="background-color: var(--accent-color); border: none;">
                                <i class="fas fa-save me-2"></i> Create Cash Account
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
