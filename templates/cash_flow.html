{% extends 'base.html' %}
{% block title %}Cash Flow Statement{% endblock %}

{% block content %}
<style>
    .report-page-icon {
        width: 42px; height: 42px; border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.1rem; color: #fff; flex-shrink: 0;
    }
    .report-card {
        border-radius: 12px; border: 1px solid #e2e8f0;
        box-shadow: 0 2px 8px rgba(0,0,0,.07); background: #fff; overflow: hidden;
    }
    .filter-card-header {
        background: #f8f9fa; border-bottom: 1px solid #e2e8f0;
        padding: .6rem 1.25rem; font-size: .72rem; font-weight: 700;
        letter-spacing: .5px; text-transform: uppercase; color: #605E5C;
    }
    .cf-table { width: 100%; border-collapse: collapse; }
    .cf-table td { padding: .45rem 1rem; font-size: .875rem; vertical-align: middle; }
    .cf-section-header td {
        background: linear-gradient(90deg, #018574 0%, #005E52 100%);
        color: #fff; font-weight: 700; font-size: .72rem;
        letter-spacing: .8px; text-transform: uppercase; padding: .55rem 1rem;
    }
    .cf-sub-header td {
        background: #f0fdfa; font-weight: 600; color: #018574;
        font-size: .78rem; border-bottom: 1px solid #b2dfdb;
        padding: .4rem 1rem .4rem 2rem;
    }
    .cf-data-row td:first-child { padding-left: 3rem; color: #323130; }
    .cf-data-row td:last-child {
        text-align: right;
        font-family: 'JetBrains Mono','Courier New',monospace;
        padding-right: 1.5rem;
    }
    .cf-bold-row td { font-weight: 700; }
    .cf-bold-row td:first-child { padding-left: 3rem; }
    .cf-bold-row td:last-child {
        text-align: right;
        font-family: 'JetBrains Mono','Courier New',monospace;
        padding-right: 1.5rem;
    }
    .cf-total-row { border-top: 2px solid #018574; }
    .cf-total-row td { font-weight: 700; padding: .6rem 1rem; }
    .cf-total-row td:first-child { color: #323130; }
    .cf-total-row td:last-child {
        text-align: right;
        font-family: 'JetBrains Mono','Courier New',monospace;
        padding-right: 1.5rem; color: #018574;
    }
    .cf-spacer td { height: 16px; background: #f8f9fa; }
    .net-change-chip {
        border-radius: 10px; padding: .75rem 1.5rem;
        font-family: 'JetBrains Mono','Courier New',monospace;
        font-size: 1.2rem; font-weight: 800;
        border: 2px solid #e2e8f0; background: #fff;
        min-width: 180px; text-align: right;
    }
    .kpi-chip {
        border-left: 4px solid #018574; border-radius: 8px;
        background: #fff; padding: .6rem 1rem;
        box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .kpi-chip .kpi-label { font-size: .65rem; font-weight: 700;
        letter-spacing: .6px; text-transform: uppercase; color: #605E5C; }
    .kpi-chip .kpi-value { font-family: 'JetBrains Mono','Courier New',monospace;
        font-size: 1rem; font-weight: 700; color: #018574; }
    .win11-btn { border-radius: 6px; font-size: .8rem; font-weight: 600;
        padding: .3rem .75rem; display: inline-flex; align-items: center; gap: .35rem; }
    .win11-btn-secondary { border: 1px solid #8a8886; color: #323130; background: #fff; }
    .win11-btn-secondary:hover { background: #f3f2f1; border-color: #605E5C; }
    @media print {
        .no-print { display: none !important; }
        .report-card { box-shadow: none !important; }
    }
</style>

<div class="container-fluid py-3">

    <!-- Page Header -->
    <div class="d-flex align-items-center gap-3 mb-4">
        <div class="report-page-icon" style="background: linear-gradient(135deg,#018574,#005E52);">
            <i class="fas fa-money-bill-wave"></i>
        </div>
        <div>
            <h5 class="mb-0 fw-bold">Cash Flow Statement</h5>
            <small class="text-muted">Financial Reports</small>
        </div>
        <div class="ms-auto d-flex gap-2 no-print">
            <button class="win11-btn win11-btn-secondary" onclick="exportCSV()">
                <i class="fas fa-file-csv"></i> Export CSV
            </button>
            <button class="win11-btn win11-btn-secondary" onclick="window.print()">
                <i class="fas fa-print"></i> Print
            </button>
        </div>
    </div>

    <!-- Filter Card -->
    <div class="report-card mb-4 no-print">
        <div class="filter-card-header"><i class="fas fa-filter me-2"></i>Filters &amp; Date Range</div>
        <div class="card-body">
            <form id="cfForm" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-semibold" style="font-size:.82rem;">From Date</label>
                    <input type="date" id="fromDate" name="from_date" class="form-control form-control-sm" value="{{ from_date }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold" style="font-size:.82rem;">To Date</label>
                    <input type="date" id="toDate" name="to_date" class="form-control form-control-sm" value="{{ to_date }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold" style="font-size:.82rem;">Filter</label>
                    <div class="d-flex gap-4 bg-white border rounded p-2" style="border-radius:6px!important;">
                        <div class="form-check mb-0">
                            <input class="form-check-input" type="radio" name="recFilter" id="rbRecAll" value="0" checked>
                            <label class="form-check-label small" for="rbRecAll">All Transactions</label>
                        </div>
                        <div class="form-check mb-0">
                            <input class="form-check-input" type="radio" name="recFilter" id="rbRecDone" value="1">
                            <label class="form-check-label small" for="rbRecDone">Reconciled Only</label>
                        </div>
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-sm btn-primary w-100 fw-semibold">
                        <i class="fas fa-bolt me-1"></i> Generate
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Report Area -->
    <div class="report-card d-none" id="reportCard">
        <!-- Report Banner -->
        <div class="text-center py-3 border-bottom" style="background:linear-gradient(135deg,#018574,#005E52);">
            <div class="text-white fw-bold" style="letter-spacing:.5px;">CASH FLOW STATEMENT</div>
            <div class="text-white opacity-75" style="font-size:.82rem;" id="reportPeriodText">For the period: </div>
        </div>

        <!-- Table -->
        <div class="p-0" id="reportContent">
            <div class="table-responsive">
                <table class="cf-table" id="cfTable">
                    <tbody id="cfTbody">
                        <!-- Injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Net Change Footer -->
        <div class="border-top p-4" style="background:#f8fffe;">
            <div class="d-flex align-items-center justify-content-between">
                <div>
                    <div style="font-size:.7rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#605E5C;">Net Increase / (Decrease) in Cash</div>
                    <div class="text-muted" style="font-size:.78rem;">Cash &amp; Cash Equivalents Movement</div>
                </div>
                <div class="net-change-chip" id="netChangeTotal">0.00</div>
            </div>
        </div>
    </div>

</div>

<script>
    document.getElementById('cfForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const fromDate = document.getElementById('fromDate').value;
        const toDate = document.getElementById('toDate').value;
        const recFilter = document.querySelector('input[name="recFilter"]:checked').value;

        if(!fromDate || !toDate) return alert("Please select both dates.");
        if(fromDate > toDate) return alert("From Date cannot be after To Date.");

        // Show loading state...
        const btn = this.querySelector('button[type="submit"]');
        const origText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Generating...';
        btn.disabled = true;

        fetch('/api/cash_flow/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                from_date: fromDate,
                to_date: toDate,
                rec_only: recFilter === '1'
            })
        })
        .then(r => r.json())
        .then(data => {
            btn.innerHTML = origText;
            btn.disabled = false;

            if(!data.success) {
                return alert("Error generating report: " + data.error);
            }

            renderReport(data.data, fromDate, toDate);
        })
        .catch(err => {
            btn.innerHTML = origText;
            btn.disabled = false;
            alert("Network error occurred.");
        });
    });

    function formatAmount(val) {
        return Number(val).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function createMainHeader(text) {
        return `<tr class="cf-section-header"><td colspan="2">${text}</td></tr>`;
    }

    function createSubHeader(text) {
        return `<tr class="cf-sub-header"><td colspan="2">${text}</td></tr>`;
    }

    function createRow(desc, amount, isBold = false, isIndent = true) {
        const cls = isBold ? 'cf-bold-row' : 'cf-data-row';
        return `<tr class="${cls}"><td>${desc}</td><td>${formatAmount(amount)}</td></tr>`;
    }

    function createTotalRow(desc, amount) {
        return `<tr class="cf-total-row"><td>${desc}</td><td>${formatAmount(amount)}</td></tr>`;
    }

    function createSpacer() {
        return `<tr class="cf-spacer"><td colspan="2"></td></tr>`;
    }

    function renderReport(data, start, end) {
        // Update header text
        document.getElementById('reportPeriodText').textContent = `For the period: ${start} to ${end}`;

        let html = '';

        // 1. Operating Activities
        html += createMainHeader("CASH FLOWS FROM OPERATING ACTIVITIES");
        html += createRow("Net Profit After Taxation", data.NetProfit, false, true);

        html += createSubHeader("Adjustments");
        let adjTotal = 0;
        data.AdjustmentItems.forEach(item => {
            html += createRow(item.Description, item.Amount);
            adjTotal += item.Amount;
        });
        let afterAdj = data.NetProfit + adjTotal;
        html += createRow("", afterAdj, true, true); // Subtotal empty description but bold amount

        html += createSubHeader("Changes In Working Capital");
        let wcTotal = 0;
        data.WorkingCapitalItems.forEach(item => {
            html += createRow(item.Description, item.Amount);
            wcTotal += item.Amount;
        });

        let netOp = afterAdj + wcTotal;
        html += createRow("Cash Generated From Operation", netOp, false, true);
        html += createTotalRow("Net Cash Flows From Operation", netOp);
        html += createSpacer();

        // 2. Investing Activities
        html += createMainHeader("CASH FLOWS FROM INVESTING ACTIVITIES");
        let netInv = 0;
        data.InvestingItems.forEach(item => {
            html += createRow(item.Description, item.Amount);
            netInv += item.Amount;
        });
        html += createTotalRow("Net Cash Used In Investing Activities", netInv);
        html += createSpacer();

        // 3. Financing Activities
        html += createMainHeader("CASH FLOWS FROM FINANCING ACTIVITIES");
        let netFin = 0;
        data.FinancingItems.forEach(item => {
            html += createRow(item.Description, item.Amount);
            netFin += item.Amount;
        });
        html += createTotalRow("Net Cash Flows From Financial Activities", netFin);
        html += createSpacer();

        // 4. Summary
        let netChange = netOp + netInv + netFin;
        html += createMainHeader("SUMMARY");
        html += createRow("Net Increase/Decrease In Cash & Cash Equivalents", netChange);
        html += createRow("Cash & Cash Equivalents At Beginning Of The Year", data.CashBeginning);
        html += createRow("Cash & Cash Equivalents At End Of The Year", data.CashEnding);
        html += createSpacer();

        // 5. Analysis
        html += createMainHeader("ANALYSIS OF CASH & CASH EQUIVALENTS");
        data.CashAccounts.forEach(item => {
            html += createRow(item.Description, item.Amount);
        });
        html += createTotalRow("Cash & Cash Equivalents At End Of The Year", data.CashEnding);

        // Inject HTML
        document.getElementById('cfTbody').innerHTML = html;

        // Set Net Change at bottom
        const netChangeEl = document.getElementById('netChangeTotal');
        netChangeEl.textContent = formatAmount(netChange);
        netChangeEl.style.color = netChange >= 0 ? '#107C10' : '#C42B1C';
        netChangeEl.style.borderColor = netChange >= 0 ? '#a5d6a7' : '#f5c6c6';

        // Show report
        document.getElementById('reportCard').classList.remove('d-none');
    }

    function exportCSV() {
        const table = document.getElementById("cfTable");
        if(!table || document.getElementById('reportCard').classList.contains('d-none')) {
            return alert("Please generate a report first.");
        }

        let csv = "Cash Flow Statement\n";
        csv += document.getElementById('reportPeriodText').textContent + "\n\n";
        csv += "Description,Amount\n";

        const rows = table.querySelectorAll('tr');
        for (let i = 0; i < rows.length; i++) {
            const cols = rows[i].querySelectorAll('td');
            if (cols.length === 1) {
                // Header or spacer
                if(cols[0].textContent.trim() !== '') {
                    csv += `"${cols[0].textContent.trim()}",\n`;
                }
            } else if (cols.length === 2) {
                // Data row
                let desc = cols[0].textContent.trim().replace(/"/g, '""');
                let amt = cols[1].textContent.trim().replace(/,/g, '');
                csv += `"${desc}",${amt}\n`;
            }
        }

        let netChangeText = document.getElementById('netChangeTotal').textContent.replace(/,/g, '');
        csv += `\n"Net Increase/(Decrease) in Cash",${netChangeText}\n`;

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `CashFlow_${new Date().toISOString().slice(0,10).replace(/-/g,'')}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
{% endblock %}
