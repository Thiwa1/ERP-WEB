{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row mb-4">
        <div class="col-12 text-dark p-3 rounded shadow-sm" style="background-color: var(--secondary-color);">
            <h4 class="mb-0 text-center fw-bold"><i class="fas fa-truck me-2"></i> ADD NEW SUPPLIER</h4>
        </div>
    </div>

    <form method="POST" action="{{ url_for('add_supplier') }}">
        <div class="row">
            <!-- Setup Details -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100 border-0">
                    <div class="card-header fw-bold text-dark" style="background-color: var(--secondary-color);">
                        <i class="fas fa-cog me-2"></i> Setup Details
                    </div>
                    <div class="card-body bg-white">
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Supplier Name</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="supplier_name" required>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Salutation</label>
                            <div class="col-sm-4">
                                <select class="form-select" name="salutation">
                                    <option value="">Select...</option>
                                    {% for sal in salutations %}
                                    <option value="{{ sal }}">{{ sal }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-sm-4">
                                <div class="input-group">
                                    <input type="text" class="form-control form-control-sm" id="newSalutation" placeholder="New">
                                    <button class="btn btn-secondary btn-sm" type="button" onclick="addSalutation()">Add</button>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Supplier Code</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="supplier_code" required>
                            </div>
                        </div>

                        <div class="mb-3 row">

<label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">VAT No</label>
<div class="col-sm-8">
    <div class="input-group">
        <input type="text" class="form-control" name="vat_no" id="vatNoInput">
        <input type="file" class="d-none" id="vatDocumentUpload" accept=".pdf">
        <button class="btn btn-outline-secondary" type="button" onclick="document.getElementById('vatDocumentUpload').click()">
            <i class="fas fa-file-pdf text-danger"></i> Upload Document (AI Scan)
        </button>
    </div>
    <small class="text-muted" id="vatStatusMessage">Upload a PDF document to automatically extract the VAT Number.</small>
</div>

                        </div>

                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Credit Limit</label>
                            <div class="col-sm-8">
                                <input type="number" class="form-control" name="credit_limit" step="0.01">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">TIN No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="tin_no" placeholder="Mandatory for WHT">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">NIC No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="nic_no">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Contact Details -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100 border-0">
                    <div class="card-header fw-bold text-dark" style="background-color: var(--secondary-color);">
                        <i class="fas fa-address-book me-2"></i> Contact Details
                    </div>
                    <div class="card-body bg-white">
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Address No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="address_no">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Address Line 01</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="address_line_1">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Address Line 02</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="address_line_2">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Address Line 03</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="address_line_3">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Address Line 04</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="address_line_4">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Contact No 01</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="contact_1">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Contact No 02</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="contact_2">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">E-Mail</label>
                            <div class="col-sm-8">
                                <input type="email" class="form-control" name="email">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="card shadow-sm border-0">
            <div class="card-body d-flex justify-content-end align-items-center bg-white">
                <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm" style="background-color: var(--accent-color); border: none;">
                    <i class="fas fa-save me-2"></i> CREATE NEW SUPPLIER
                </button>
            </div>
        </div>
    </form>
</div>

<script>
    function addSalutation() {
        const newVal = document.getElementById('newSalutation').value;
        if (!newVal) return;

        const formData = new FormData();
        formData.append('new_salutation', newVal);
        formData.append('redirect_url', window.location.pathname); // Tell backend where to return

        fetch('/add_salutation_ajax', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                location.reload();
            } else {
                alert('Error adding salutation');
            }
        });
    }
</script>

<script>
    document.getElementById('vatDocumentUpload').addEventListener('change', function(e) {
        if (!e.target.files.length) return;

        const file = e.target.files[0];
        const statusMsg = document.getElementById('vatStatusMessage');
        const vatInput = document.getElementById('vatNoInput');

        if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
            statusMsg.innerHTML = '<span class="text-danger"><i class="fas fa-times-circle"></i> Please upload a PDF file.</span>';
            return;
        }

        const formData = new FormData();
        formData.append('document', file);

        statusMsg.innerHTML = '<span class="text-primary"><i class="fas fa-spinner fa-spin"></i> Analyzing document for VAT Number...</span>';

        fetch('/api/extract_vat_from_pdf', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                vatInput.value = data.vat_no;
                statusMsg.innerHTML = '<span class="text-success"><i class="fas fa-check-circle"></i> Found VAT Number: ' + data.vat_no + '</span>';
            } else {
                statusMsg.innerHTML = '<span class="text-warning"><i class="fas fa-exclamation-triangle"></i> ' + data.message + '</span>';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            statusMsg.innerHTML = '<span class="text-danger"><i class="fas fa-times-circle"></i> Error processing document.</span>';
        });
    });
</script>

{% endblock %}
