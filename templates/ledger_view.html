{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">

  <!-- Page Header -->
  <div class="d-flex align-items-center gap-3 mb-4">
    <div style="width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#0078D4,#005FA3);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <i class="fas fa-book-open text-white" style="font-size:.95rem;"></i>
    </div>
    <div>
      <h5 class="mb-0 fw-bold text-dark">Ledger View</h5>
      <div style="font-size:.7rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#605E5C;">General Ledger</div>
    </div>
    <a href="/transaction_search" class="ms-auto btn btn-sm fw-bold"
       style="background:#eef2ff;border:1px solid #c7d2fc;border-radius:8px;color:#4f46e5;font-size:.8rem;padding:7px 14px;">
      <i class="fas fa-search-dollar me-1"></i> Search all transactions (amount / narration)
    </a>
  </div>

  <!-- Filters Card -->
  <div class="mb-4" style="border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.07);background:#fff;padding:1.25rem 1.5rem;">
    <div class="row g-3 align-items-end">
      <!-- Account Selector -->
      <div class="col-md-4">
        <label class="form-label fw-bold small" style="color:#374151;">Select Account</label>
        <select id="accountSelect" class="form-select select2" style="border-radius:8px;">
          <option value="">-- Select Account --</option>
          <optgroup label="P&L Accounts">
            {% for acc in pl_accounts %}
            <option value="{{ acc.account_name }}">{{ acc.account_name }}</option>
            {% endfor %}
          </optgroup>
          <optgroup label="Balance Sheet Accounts">
            {% for acc in bs_accounts %}
            <option value="{{ acc.account_name }}">{{ acc.account_name }}</option>
            {% endfor %}
          </optgroup>
        </select>
      </div>

      <!-- From Date -->
      <div class="col-md-2">
        <label class="form-label fw-bold small" style="color:#374151;">From Date</label>
        <input type="date" id="fromDate" class="form-control" value="{{ default_from }}" style="border-radius:8px;">
      </div>

      <!-- To Date -->
      <div class="col-md-2">
        <label class="form-label fw-bold small" style="color:#374151;">To Date</label>
        <input type="date" id="toDate" class="form-control" value="{{ default_to }}" style="border-radius:8px;">
      </div>

      <!-- Load Button -->
      <div class="col-md-1">
        <button type="button" class="btn w-100 fw-bold text-white" onclick="loadLedger()"
          style="background:var(--accent-color);border:none;border-radius:8px;font-weight:600;padding:.55rem 0;">
          <i class="fas fa-sync-alt me-1"></i> Load
        </button>
      </div>
      <!-- Export CSV -->
      <div class="col-md-1">
        <button type="button" class="btn w-100 fw-bold" onclick="exportLedgerCSV()"
          style="background:#f0f4ff;border:1px solid #c7d2fc;border-radius:8px;font-weight:600;color:#3730a3;padding:.55rem 0;">
          <i class="fas fa-file-csv me-1"></i> CSV
        </button>
      </div>

      <!-- Search Box -->
      <div class="col-md-2">
        <label class="form-label fw-bold small" style="color:#374151;">Search</label>
        <input type="text" id="searchBox" class="form-control" placeholder="Search entries..." onkeyup="filterTable()"
          style="border-radius:8px;">
      </div>
    </div>
  </div>

  <!-- Ledger Table Card -->
  <div style="border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.07);background:#fff;overflow:hidden;">
    <div class="table-responsive" style="max-height:600px;">
      <table class="table table-hover mb-0" id="ledgerTable">
        <thead style="position:sticky;top:0;z-index:2;background:#f8f9fa;">
          <tr>
            <th style="font-size:.72rem;text-transform:uppercase;font-weight:700;color:#605E5C;border-bottom:2px solid #e2e8f0;padding:.75rem 1rem;width:5%;">No</th>
            <th style="font-size:.72rem;text-transform:uppercase;font-weight:700;color:#605E5C;border-bottom:2px solid #e2e8f0;padding:.75rem 1rem;width:12%;">Date</th>
            <th style="font-size:.72rem;text-transform:uppercase;font-weight:700;color:#605E5C;border-bottom:2px solid #e2e8f0;padding:.75rem 1rem;width:10%;">JV No</th>
            <th style="font-size:.72rem;text-transform:uppercase;font-weight:700;color:#605E5C;border-bottom:2px solid #e2e8f0;padding:.75rem 1rem;width:40%;">Narration</th>
            <th style="font-size:.72rem;text-transform:uppercase;font-weight:700;color:#605E5C;border-bottom:2px solid #e2e8f0;padding:.75rem 1rem;width:11%;text-align:right;">Debit</th>
            <th style="font-size:.72rem;text-transform:uppercase;font-weight:700;color:#605E5C;border-bottom:2px solid #e2e8f0;padding:.75rem 1rem;width:11%;text-align:right;">Credit</th>
            <th style="font-size:.72rem;text-transform:uppercase;font-weight:700;color:#605E5C;border-bottom:2px solid #e2e8f0;padding:.75rem 1rem;width:11%;text-align:right;">Balance</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="7" class="text-center py-5 text-muted fst-italic" style="border:none;">
              <i class="fas fa-book-open fa-2x mb-2 d-block" style="color:#ccc;"></i>
              Select an account and click Load to view transactions.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
    function loadLedger() {
        const account = $('#accountSelect').val(); // Select2 uses jQuery val()
        const fromDate = document.getElementById('fromDate').value;
        const toDate = document.getElementById('toDate').value;
        const tbody = document.getElementById('tableBody');

        if (!account) {
            alert("Please select an account.");
            return;
        }

        // Show Loading
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5"><div class="spinner-border text-primary" role="status"></div><div class="mt-2 text-muted">Loading transactions...</div></td></tr>';

        fetch('/api/ledger_data', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                account_name: account,
                from_date: fromDate,
                to_date: toDate
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-5 text-danger fw-bold"><i class="fas fa-exclamation-triangle me-2"></i>${data.error}</td></tr>`;
                return;
            }

            if (data.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">No transactions found for this period.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            let count = 0;

            data.data.forEach((row, index) => {
                const isOpening = row.is_opening;
                const rowClass = isOpening ? 'table-warning fw-bold' : '';
                const narrationStyle = isOpening ? 'fst-italic' : '';
                const no = isOpening ? '-' : ++count;

                // Format Numbers
                const dr = row.dr !== 0 ? parseFloat(row.dr).toLocaleString('en-US', {minimumFractionDigits: 2}) : '-';
                const cr = row.cr !== 0 ? parseFloat(row.cr).toLocaleString('en-US', {minimumFractionDigits: 2}) : '-';
                const bal = parseFloat(row.balance).toLocaleString('en-US', {minimumFractionDigits: 2});
                const jv = row.jv_no || '-';

                const tr = `
                    <tr class="${rowClass}" style="border-bottom:1px solid #f1f3f5;">
                        <td style="padding:.65rem 1rem;text-align:center;">${no}</td>
                        <td style="padding:.65rem 1rem;">${row.date}</td>
                        <td style="padding:.65rem 1rem;text-align:center;font-family:'Courier New',monospace;font-size:.85rem;">${jv}</td>
                        <td style="padding:.65rem 1rem;" class="${narrationStyle}">${row.narration}</td>
                        <td style="padding:.65rem 1rem;text-align:right;font-family:'Courier New',monospace;font-size:.88rem;color:#dc2626;">${dr}</td>
                        <td style="padding:.65rem 1rem;text-align:right;font-family:'Courier New',monospace;font-size:.88rem;color:#059669;">${cr}</td>
                        <td style="padding:.65rem 1rem;text-align:right;font-family:'Courier New',monospace;font-size:.88rem;font-weight:700;">${bal}</td>
                    </tr>
                `;
                tbody.innerHTML += tr;
            });
        })
        .catch(err => {
            console.error(err);
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-danger">Error loading data. See console for details.</td></tr>';
        });
    }

    // Client-side Search/Filter
    function filterTable() {
        const input = document.getElementById("searchBox");
        const filter = input.value.toUpperCase();
        const table = document.getElementById("ledgerTable");
        const tr = table.getElementsByTagName("tr");

        for (let i = 1; i < tr.length; i++) { // Start from 1 to skip header
            let visible = false;
            const tds = tr[i].getElementsByTagName("td");

            for (let j = 0; j < tds.length; j++) {
                if (tds[j]) {
                    const txtValue = tds[j].textContent || tds[j].innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        visible = true;
                        break;
                    }
                }
            }
            tr[i].style.display = visible ? "" : "none";
        }
    }

    function exportLedgerCSV() {
        const acc  = document.getElementById('accountSelect').value;
        const from = document.getElementById('fromDate').value;
        const to   = document.getElementById('toDate').value;
        if (!acc) { alert('Please select an account first.'); return; }
        window.location.href = `/ledger_view/export?account_name=${encodeURIComponent(acc)}&from_date=${from}&to_date=${to}`;
    }
</script>
{% endblock %}
