{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row mb-4">
        <div class="col-12 bg-primary text-white p-3 rounded">
            <h4 class="mb-0 text-center fw-bold">ADD NEW JOB</h4>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form method="POST" action="{{ url_for('add_new_job') }}">
                        <div class="mb-3 row">
                            <label class="col-sm-3 col-form-label fw-bold text-primary">Job No</label>
                            <div class="col-sm-9">
                                <input type="number" class="form-control" name="job_no" required>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-3 col-form-label fw-bold text-primary">Job Description</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" name="job_description" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end mt-4">
                            <button type="submit" class="btn btn-primary fw-bold px-5">Create New Job</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
