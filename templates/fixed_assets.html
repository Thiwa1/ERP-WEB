{% extends "base.html" %}

{% block title %}Fixed Assets Register{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 mb-0 text-gray-800"><i class="fas fa-building me-2 text-primary"></i> Fixed Assets Register</h2>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addAssetModal">
                <i class="fas fa-plus"></i> Add Asset
            </button>
            <form id="depreciationForm" class="d-flex gap-2">
                <input type="month" name="month" class="form-control" required>
                <button type="submit" class="btn btn-warning text-white">
                    <i class="fas fa-calculator"></i> Run Depreciation
                </button>
            </form>
        </div>
    </div>

    <!-- Main Grid -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Assets Overview</h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover mb-0" id="assetsTable" style="font-size: 0.85rem; white-space: nowrap;">
                    <thead class="table-dark">
                        <tr id="tableHeader">
                            <!-- JS will populate -->
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- JS will populate -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Add Modal -->
<div class="modal fade" id="addAssetModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <form action="/fixed_assets/add" method="POST">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Add New Fixed Asset</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Asset Class</label>
                            <input type="text" name="asset_class" class="form-control" list="assetClassList" placeholder="Search or Create..." required>
                            <datalist id="assetClassList">
                                {% for c in classes %}
                                <option value="{{ c.asset_class }}">
                                {% endfor %}
                            </datalist>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Description</label>
                            <input type="text" name="description" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Brand</label>
                            <input type="text" name="brand_name" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Serial No</label>
                            <input type="text" name="serial_no" class="form-control">
                        </div>
                         <div class="col-md-4">
                            <label class="form-label fw-bold">Quantity</label>
                            <input type="number" name="quantity" class="form-control" value="1" min="1">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Location</label>
                            <input type="text" name="location" class="form-control" list="locationList" placeholder="Search or Create...">
                            <datalist id="locationList">
                                {% for l in locations %}
                                <option value="{{ l.location }}">
                                {% endfor %}
                            </datalist>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Purchasing Date</label>
                            <input type="date" name="purchasing_date" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Cost Value</label>
                            <input type="number" step="0.01" name="cost_value" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Depreciable Life (Months)</label>
                            <input type="number" name="depreciable_life_months" class="form-control" required>
                        </div>

                        <div class="col-12"><hr><h6 class="text-primary fw-bold">GL Accounts Configuration</h6></div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-uppercase text-muted">Asset Account</label>
                            <select name="asset_account_id" class="form-select select2" required style="width: 100%;">
                                <option value="">-- Select --</option>
                                {% for acc in accounts %}
                                <option value="{{ acc.id }}">{{ acc.account_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-uppercase text-muted">Expense Account</label>
                            <select name="expense_account_id" class="form-select select2" required style="width: 100%;">
                                <option value="">-- Select --</option>
                                {% for acc in accounts %}
                                <option value="{{ acc.id }}">{{ acc.account_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-uppercase text-muted">Acc. Dep. Account</label>
                            <select name="accumulated_dep_account_id" class="form-select select2" required style="width: 100%;">
                                <option value="">-- Select --</option>
                                {% for acc in accounts %}
                                <option value="{{ acc.id }}">{{ acc.account_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Asset</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Re-initialize select2 specifically for modal elements when modal opens
        $('#addAssetModal').on('shown.bs.modal', function () {
            $('.select2').select2({
                theme: 'bootstrap-5',
                width: '100%',
                dropdownParent: $('#addAssetModal') // Critical for select2 in modal
            });
        });

        loadData();

        document.getElementById('depreciationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);

            if(!confirm('Run depreciation for ' + formData.get('month') + '? This will generate Journal Entries.')) return;

            fetch('/fixed_assets/calculate_depreciation', {
                method: 'POST',
                body: formData
            })
            .then(r => r.json())
            .then(data => {
                if(data.error) alert(data.error);
                else {
                    alert('Success! Processed ' + data.processed + ' assets. JV ID: ' + data.jv_id);
                    loadData();
                }
            })
            .catch(e => alert('Error: ' + e));
        });
    });

    function loadData() {
        fetch('/fixed_assets/data')
        .then(r => r.json())
        .then(data => {
            const thead = document.getElementById('tableHeader');
            const tbody = document.getElementById('tableBody');

            // Build Header
            thead.innerHTML = '';
            data.columns.forEach(col => {
                const th = document.createElement('th');
                th.textContent = col;
                // Add specific styling for month columns if needed
                if(col.includes('-') && col.length < 9) th.classList.add('bg-secondary', 'text-white');
                thead.appendChild(th);
            });

            // Build Body
            tbody.innerHTML = '';
            data.data.forEach(row => {
                const tr = document.createElement('tr');

                // Static Fields
                const staticFields = ['class', 'desc', 'brand', 'qty', 'serial', 'location', 'cost', 'date', 'life'];
                staticFields.forEach(field => {
                    const td = document.createElement('td');
                    let val = row[field];
                    if(field === 'cost') val = parseFloat(val).toLocaleString(undefined, {minimumFractionDigits: 2});
                    td.textContent = val;
                    tr.appendChild(td);
                });

                // Month Fields
                data.month_headers.forEach(m => {
                    const td = document.createElement('td');
                    const val = row[m] || 0;
                    td.textContent = val > 0 ? val.toLocaleString(undefined, {minimumFractionDigits: 2}) : '-';
                    tr.appendChild(td);
                });

                // Totals
                const tdTotal = document.createElement('td');
                tdTotal.textContent = row.total_dep.toLocaleString(undefined, {minimumFractionDigits: 2});
                tdTotal.classList.add('fw-bold');
                tr.appendChild(tdTotal);

                const tdNBV = document.createElement('td');
                tdNBV.textContent = row.nbv.toLocaleString(undefined, {minimumFractionDigits: 2});
                tdNBV.classList.add('fw-bold', 'text-success');
                tr.appendChild(tdNBV);

                tbody.appendChild(tr);
            });
        });
    }
</script>
{% endblock %}
