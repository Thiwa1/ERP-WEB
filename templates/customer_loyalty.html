{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Customer Loyalty Registration</h2>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">Register New Loyalty Customer</div>
        <div class="card-body">
            <form method="POST" action="/customer_loyalty">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Customer Name</label>
                            <input type="text" name="customer_name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Billing Address</label>
                            <input type="text" name="billing_address" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Delivery Address</label>
                            <input type="text" name="delivery_address" class="form-control">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label fw-bold">E-Mail</label>
                            <input type="email" name="email" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mobile No</label>
                            <input type="text" name="mobile_no" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Amount Paid</label>
                            <input type="number" step="0.01" name="amount_paid" class="form-control">
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 mt-3">Register Customer</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
