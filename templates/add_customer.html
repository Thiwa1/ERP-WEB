{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row mb-4">
        <div class="col-12 text-white p-3 rounded shadow-sm" style="background-color: var(--secondary-color);">
            <h4 class="mb-0 text-center fw-bold"><i class="fas fa-user-plus me-2"></i> ADD NEW CUSTOMER</h4>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
            <i class="fas fa-info-circle me-2"></i> CUSTOMER DETAILS
        </div>
        <div class="card-body bg-white">
            <form method="POST" action="/add_customer">
                <div class="row">
                    <!-- Left Panel: Basic Information -->
                    <div class="col-md-6 border-end">
                        <h5 class="fw-bold mb-3" style="color: var(--primary-color);">Basic Information</h5>

                        <div class="mb-3 row">
                            <label for="supplier_name" class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Customer Name</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="supplier_name" name="supplier_name" required>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="salutation" class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Salutation</label>
                            <div class="col-sm-8 d-flex">
                                <select class="form-select me-2" id="salutation" name="salutation">
                                    {% for sal in salutations %}
                                    <option value="{{ sal }}">{{ sal }}</option>
                                    {% endfor %}
                                </select>
                                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#salutationModal">+</button>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="supplier_code" class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Customer Code</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="supplier_code" name="supplier_code">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="credit_limit" class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Credit Limit</label>
                            <div class="col-sm-8">
                                <input type="number" step="0.01" class="form-control" id="credit_limit" name="credit_limit">
                            </div>
                        </div>


                        <div class="mb-3 row">
                            <label for="vatNoInput" class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">VAT No</label>
                            <div class="col-sm-8">
                                <div class="input-group">
                                    <input type="text" class="form-control" id="vatNoInput" name="vat_no">
                                    <input type="file" class="d-none" id="vatDocumentUpload" accept=".pdf">
                                    <button class="btn btn-outline-secondary" type="button" onclick="document.getElementById('vatDocumentUpload').click()">
                                        <i class="fas fa-file-pdf text-danger"></i> Scan AI
                                    </button>
                                </div>
                                <small class="text-muted" id="vatStatusMessage">Upload document for auto-extraction.</small>
                            </div>
                        </div>

                    </div>

                    <!-- Right Panel: Address & Contact -->
                    <div class="col-md-6">
                        <h5 class="fw-bold mb-3" style="color: var(--primary-color);">Address Details</h5>

                        <div class="mb-3 row">
                            <label for="address_no" class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Address No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="address_no" name="address_no">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="address_line_1" class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Address Line 01</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="address_line_1" name="address_line_1">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="address_line_2" class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Address Line 02</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="address_line_2" name="address_line_2">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="address_line_3" class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Address Line 03</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="address_line_3" name="address_line_3">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="address_line_4" class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Address Line 04</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="address_line_4" name="address_line_4">
                            </div>
                        </div>

                        <h5 class="fw-bold mt-4 mb-3" style="color: var(--primary-color);">Contact Details</h5>

                        <div class="mb-3 row">
                            <label for="contact_1" class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Contact No 01</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="contact_1" name="contact_1">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="contact_2" class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">Contact No 02</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="contact_2" name="contact_2">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="email" class="col-sm-4 col-form-label fw-bold" style="color: var(--primary-color);">E-Mail</label>
                            <div class="col-sm-8">
                                <input type="email" class="form-control" id="email" name="email">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm" style="background-color: var(--accent-color); border: none;">
                        <i class="fas fa-save me-2"></i> CREATE NEW CUSTOMER
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal for Adding Salutation -->
<div class="modal fade" id="salutationModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header text-white" style="background-color: var(--secondary-color);">
        <h5 class="modal-title fw-bold">Add Salutation</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form action="/add_salutation" method="POST">
          <div class="modal-body">
            <input type="text" class="form-control" name="new_salutation" placeholder="Enter Salutation (e.g. Mr, Mrs)" required>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary" style="background-color: var(--accent-color); border: none;">Save changes</button>
          </div>
      </form>
    </div>
  </div>
</div>

<script>
    document.getElementById('vatDocumentUpload').addEventListener('change', function(e) {
        if (!e.target.files.length) return;

        const file = e.target.files[0];
        const statusMsg = document.getElementById('vatStatusMessage');
        const vatInput = document.getElementById('vatNoInput');

        if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
            statusMsg.innerHTML = '<span class="text-danger"><i class="fas fa-times-circle"></i> Please upload a PDF file.</span>';
            return;
        }

        const formData = new FormData();
        formData.append('document', file);

        statusMsg.innerHTML = '<span class="text-primary"><i class="fas fa-spinner fa-spin"></i> Analyzing document for VAT Number...</span>';

        fetch('/api/extract_vat_from_pdf', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                vatInput.value = data.vat_no;
                statusMsg.innerHTML = '<span class="text-success"><i class="fas fa-check-circle"></i> Found VAT Number: ' + data.vat_no + '</span>';
            } else {
                statusMsg.innerHTML = '<span class="text-warning"><i class="fas fa-exclamation-triangle"></i> ' + data.message + '</span>';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            statusMsg.innerHTML = '<span class="text-danger"><i class="fas fa-times-circle"></i> Error processing document.</span>';
        });
    });
</script>

{% endblock %}
