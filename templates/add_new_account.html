{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row mb-4">
        <div class="col-12 text-dark p-3 rounded shadow-sm" style="background-color: var(--secondary-color);">
            <h4 class="mb-0 text-center fw-bold"><i class="fas fa-file-contract me-2"></i> MANAGE THE NEW ACCOUNT</h4>
        </div>
    </div>

    <form method="POST" action="{{ url_for('add_new_account') }}">
        <!-- Account Type Selection -->
        <div class="card shadow-sm mb-4 border-0">
            <div class="card-header fw-bold text-dark" style="background-color: var(--secondary-color);">
                <i class="fas fa-check-circle me-2"></i> Select Account Type
            </div>
            <div class="card-body bg-white">
                <div class="d-flex justify-content-center gap-4 flex-wrap">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="account_type" value="income" id="check_income">
                        <label class="form-check-label fw-bold" style="color: var(--primary-color);" for="check_income">Income Account</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="account_type" value="expense" id="check_expense">
                        <label class="form-check-label fw-bold" style="color: var(--primary-color);" for="check_expense">Expenses Account</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="account_type" value="liability" id="check_liability">
                        <label class="form-check-label fw-bold" style="color: var(--primary-color);" for="check_liability">Liability Account</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="account_type" value="equity" id="check_equity">
                        <label class="form-check-label fw-bold" style="color: var(--primary-color);" for="check_equity">Equity Account</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="account_type" value="asset" id="check_asset">
                        <label class="form-check-label fw-bold" style="color: var(--primary-color);" for="check_asset">Assets Account</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Left Column: Account Details -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100 border-0">
                    <div class="card-header fw-bold text-dark" style="background-color: var(--secondary-color);">
                        <i class="fas fa-info-circle me-2"></i> Account Details
                    </div>
                    <div class="card-body bg-white">
                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Account Name</label>
                            <input type="text" class="form-control" name="account_name" id="accountNameInput" placeholder="Enter account name" spellcheck="true">
                            <div id="aiSuggestion" class="form-text text-success fw-bold" style="display:none;"><i class="fas fa-robot"></i> AI Suggestion: <span id="suggestionText"></span></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Currency</label>
                            <select class="form-select" name="currency_code">
                                {% for curr in currencies %}
                                <option value="{{ curr.currency_code }}">{{ curr.currency_code }} - {{ curr.currency_name }}</option>
                                {% endfor %}
                            </select>
                            <div class="form-text">If different from Base Currency, transactions will require exchange rates.</div>
                        </div>

                        <hr class="my-4">
                        <h6 class="fw-bold text-secondary mb-3"><i class="fas fa-level-down-alt me-2"></i> Sub Account (Optional)</h6>

                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Sub Account Name</label>
                            <input type="text" class="form-control" name="sub_account_name" placeholder="Enter sub account name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Main Account For Sub Account</label>
                            <select class="form-select" name="main_account_select">
                                <option value="">Select Main Account...</option>
                                {% for acc in existing_accounts %}
                                <option value="{{ acc.account_name }}">{{ acc.account_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Category Selection -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100 border-0">
                    <div class="card-header fw-bold text-dark" style="background-color: var(--secondary-color);">
                        <i class="fas fa-list-ul me-2"></i> Category Selection
                    </div>
                    <div class="card-body bg-white">
                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Balance Sheet Category</label>
                            <select class="form-select" name="bs_category">
                                <option value="">Please select</option>
                                {% for cat in bs_categories %}
                                <option value="{{ cat.name_of_category }},{{ cat.holding_position }}">{{ cat.name_of_category }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Income Category</label>
                            <select class="form-select" name="income_category">
                                <option value="">Please select</option>
                                {% for cat in pl_categories %}
                                <option value="{{ cat.name_of_category }},{{ cat.holding_position }}">{{ cat.name_of_category }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Cash Flow Category</label>
                            <select class="form-select" name="cf_category">
                                <option value="">-- Select Cash Flow Category --</option>
                                {% for cat in cf_categories %}
                                <option value="{{ cat.catogory_name }}">{{ cat.catogory_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="card shadow-sm border-0">
            <div class="card-body d-flex justify-content-end gap-2 bg-white">
                <button type="submit" name="action" value="add_account" class="btn btn-primary fw-bold px-4" style="background-color: var(--accent-color); border: none;">
                    <i class="fas fa-plus me-1"></i> Add New Account
                </button>
                <button type="submit" name="action" value="add_sub_account" class="btn btn-secondary fw-bold px-4">
                    <i class="fas fa-level-down-alt me-1"></i> Sub Account
                </button>
                <a href="/chart_of_accounts" class="btn btn-info fw-bold px-4 text-dark">
                    <i class="fas fa-list me-1"></i> List Account
                </a>
                <a href="/cash_flow_categories" class="btn btn-warning fw-bold px-4 text-dark">
                    <i class="fas fa-tags me-1"></i> CF Category
                </a>
            </div>
        </div>
    </form>
</div>

<script>
    // Enforce mutual exclusivity for checkboxes
    const checkboxes = document.querySelectorAll('input[name="account_type"]');
    checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', function() {
            if (this.checked) {
                checkboxes.forEach(cb => {
                    if (cb !== this) cb.checked = false;
                });
            }
        });
    });

    // AI Prediction Logic
    const nameInput = document.getElementById('accountNameInput');
    const suggestionDiv = document.getElementById('aiSuggestion');
    const suggestionText = document.getElementById('suggestionText');

    nameInput.addEventListener('blur', function() {
        const name = this.value.trim();
        if (name.length < 3) return;

        fetch(`/api/predict_account_type?name=${encodeURIComponent(name)}`)
            .then(response => response.json())
            .then(data => {
                if (data.confidence > 0.75 && data.mapped_type) {
                    // Auto select checkbox
                    const targetCheckbox = document.getElementById(`check_${data.mapped_type}`);
                    if (targetCheckbox) {
                        // Uncheck others first (mutual exclusivity)
                        checkboxes.forEach(cb => cb.checked = false);

                        targetCheckbox.checked = true;

                        // Show Suggestion
                        suggestionText.innerText = `Classified as ${data.original_type} (${(data.confidence * 100).toFixed(0)}% confidence)`;
                        suggestionDiv.style.display = 'block';

                        // Flash the box
                        targetCheckbox.parentElement.classList.add('bg-warning', 'bg-opacity-25', 'rounded');
                        setTimeout(() => {
                            targetCheckbox.parentElement.classList.remove('bg-warning', 'bg-opacity-25', 'rounded');
                        }, 2000);
                    }
                } else if (data.confidence > 0) {
                     // Low confidence, just hint
                     // User instruction said "connect internet if < 75%", we just ignore or could show hint
                     suggestionDiv.style.display = 'none';
                } else {
                    suggestionDiv.style.display = 'none';
                }
            })
            .catch(err => console.error('AI Prediction Error:', err));
    });
</script>
{% endblock %}
