{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row mb-4">
        <div class="col-12 bg-primary text-white p-3 rounded">
            <h4 class="mb-0 text-center fw-bold">SETUP THE COMPANY PROFILE</h4>
        </div>
    </div>

    <form method="POST" action="{{ url_for('company_profile') }}" enctype="multipart/form-data">
        <div class="row">
            <!-- Left Panel: Form Fields -->
            <div class="col-md-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Company Name</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="company_name" value="{{ company.company_name }}" required>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Address No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="address_no" value="{{ company.company_addras_1 }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">City</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="city" value="{{ company.company_addras_2 }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Province</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="province" value="{{ company.company_addras_3 }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Country</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="country" value="{{ company.company_addras_4 }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Postal Code</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="postal_code" value="{{ company.company_addras_5 }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Land No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="land_no" value="{{ company.company_land_line }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Fax No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="fax_no" value="{{ company.company_fax_line }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">VAT No</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="vat_no" value="{{ company.company_vate_code }}">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label fw-bold text-primary">Currency Symbol</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="currency" value="{{ company.company_curency }}" style="width: 140px;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Logo Section -->
            <div class="col-md-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-body text-center">
                        <h6 class="fw-bold text-primary mb-3">Company Logo</h6>
                        <div class="border rounded p-2 mb-3 bg-light d-flex align-items-center justify-content-center" style="height: 180px;">
                            {% if company.company_log %}
                            <img src="data:image/jpeg;base64,{{ company.company_log }}" alt="Company Logo" class="img-fluid" style="max-height: 100%;">
                            {% else %}
                            <span class="text-muted">No Logo</span>
                            {% endif %}
                        </div>
                        <div class="mb-3">
                            <input class="form-control" type="file" name="logo" accept="image/jpeg, image/png">
                        </div>
                        <p class="small text-muted">Recommended: 300x300px PNG with transparent background</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="card shadow-sm">
            <div class="card-body d-flex justify-content-end">
                <button type="submit" class="btn btn-primary fw-bold px-5">Submit Company Details</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
