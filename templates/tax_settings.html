{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <div class="d-flex align-items-center mb-4">
    <h4 class="mb-0 fw-bold text-dark"><i class="text-success fas fa-percentage me-2"></i> Tax Settings (Wht/Ait)</h4>
</div>

    <div class="row">
        <!-- Left: List -->
        <div class="col-md-8 mb-4">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-header text-primary fw-bold bg-transparent border-0 pb-0 pt-4" >
                    <i class="fas fa-list me-2"></i> Current Tax Rates
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Tax Name</th>
                                <th>Rate (%)</th>
                                <th>Description</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for rate in rates %}
                            <tr>
                                <td>{{ rate.id }}</td>
                                <td class="fw-bold">{{ rate.tax_name }}</td>
                                <td>{{ rate.rate }}%</td>
                                <td>{{ rate.description }}</td>
                                <td class="text-center">
                                    <form method="POST" action="{{ url_for('tax_settings') }}" onsubmit="return confirm('Delete this tax rate?');">
                                        <input type="hidden" name="action" value="delete">
                                        <input type="hidden" name="id" value="{{ rate.id }}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger border-0"><i class="fas fa-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                            {% else %}
                            <tr><td colspan="5" class="text-center text-muted">No tax rates defined.</td></tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Right: Add New -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-header text-primary fw-bold bg-transparent border-0 pb-0 pt-4" >
                    <i class="fas fa-plus-circle me-2"></i> Add New Tax
                </div>
                <div class="card-body bg-white">
                    <form method="POST" action="{{ url_for('tax_settings') }}">
                        <input type="hidden" name="action" value="add">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tax Name</label>
                            <input type="text" class="form-control" name="tax_name" placeholder="e.g. WHT - Dividends" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Rate (%)</label>
                            <input type="number" class="form-control" name="tax_rate" step="0.01" placeholder="e.g. 15" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Description</label>
                            <textarea class="form-control" name="description" rows="3"></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary fw-bold" style="background-color: var(--accent-color); border: none;">
                                <i class="fas fa-save me-2"></i> Save Rate
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
