<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Login - Suwin Accounting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f5f8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Avenir Next', 'Segoe UI', sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 12px;
            border: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h3 {
            font-weight: 700;
            color: #4188ff;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .login-header p {
            color: #6b6c72;
            font-size: 0.95rem;
        }
        .form-label {
            font-weight: 600;
            color: #393a3d;
        }
        .form-control {
            border-radius: 6px;
            border: 1px solid #d4d7dc;
            padding: 12px 15px;
        }
        .form-control:focus {
            border-color: #649eff;
            box-shadow: 0 0 0 0.25rem rgba(65, 136, 255, 0.25);
        }
        .btn-login {
            background-color: #649eff;
            color: #fff;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            padding: 14px;
            width: 100%;
            font-size: 1.1rem;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        .btn-login:hover {
            background-color: #4188ff;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h3><i class="fas fa-cash-register"></i> POS System</h3>
            <p>Sign in to Point of Sale terminal</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} rounded-3 shadow-sm py-2">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('pos_login') }}" method="POST">
            <div class="mb-3">
                <label for="company" class="form-label">Company Name</label>
                <input type="text" class="form-control" id="company" name="company" placeholder="Enter company name" required>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label">POS Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Cashier username" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">POS Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Terminal password" required>
            </div>

            <button type="submit" class="btn btn-login"><i class="fas fa-sign-in-alt me-2"></i> Access POS</button>

            <div class="text-center mt-3">
                <a href="{{ url_for('login') }}" class="text-decoration-none text-secondary"><i class="fas fa-arrow-left me-1"></i> Back to ERP Login</a>
            </div>
        </form>
    </div>
</body>
</html>
