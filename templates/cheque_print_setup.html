{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <!-- Header -->
    <div class="row mb-4">
        <div class="col-12 text-white p-3 rounded shadow-sm" style="background-color: var(--secondary-color);">
            <h4 class="mb-0 text-center fw-bold"><i class="fas fa-print me-2"></i> CHEQUE PRINT SETTINGS</h4>
        </div>
    </div>

    <form method="POST" action="{{ url_for('cheque_print_setup') }}">
        <div class="row">
            <!-- Left: Settings Form -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm h-100 border-0">
                    <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
                        <i class="fas fa-cog me-2"></i> Configuration
                    </div>
                    <div class="card-body bg-light">
                        <!-- Bank Account -->
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Bank Account</label>
                            <div class="input-group">
                                <select class="form-select" name="bank_account" id="bankSelect" onchange="window.location.href='/cheque_print_setup?bank_account=' + this.value">
                                    <option value="">Default (All Accounts)</option>
                                    {% for acc in bank_accounts %}
                                    <option value="{{ acc.bank_bookcol_account_number }}" {% if selected_bank == acc.bank_bookcol_account_number %}selected{% endif %}>{{ acc.bank_bookcol_account_number }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <!-- Paper Size -->
                        <h6 class="border-bottom pb-2 mb-3 fw-bold text-secondary">Paper Size (mm)</h6>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="small text-muted">Width</label>
                                <input type="number" class="form-control" name="paper_width" id="paperWidth" step="0.1" value="{{ settings.paper_width_mm or 175 }}" oninput="updatePreview()">
                            </div>
                            <div class="col-6">
                                <label class="small text-muted">Height</label>
                                <input type="number" class="form-control" name="paper_height" id="paperHeight" step="0.1" value="{{ settings.paper_height_mm or 76 }}" oninput="updatePreview()">
                            </div>
                        </div>

                        <!-- Coordinates -->
                        <h6 class="border-bottom pb-2 mb-3 fw-bold text-secondary">Coordinates (mm) & Font (pt)</h6>

                        <!-- Date -->
                        <div class="row g-2 mb-2 align-items-end">
                            <div class="col-4"><label class="small fw-bold">Date</label></div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="date_x" id="dateX" placeholder="X" step="0.1" value="{{ settings.date_x or 140 }}" oninput="updatePreview()">
                            </div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="date_y" id="dateY" placeholder="Y" step="0.1" value="{{ settings.date_y or 10 }}" oninput="updatePreview()">
                            </div>
                            <div class="col-2">
                                <input type="number" class="form-control form-control-sm" name="date_fs" id="dateFS" placeholder="Sz" value="{{ settings.date_font_size or 10 }}" oninput="updatePreview()">
                            </div>
                        </div>

                        <!-- Payee -->
                        <div class="row g-2 mb-2 align-items-end">
                            <div class="col-4"><label class="small fw-bold">Payee</label></div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="payee_x" id="payeeX" placeholder="X" step="0.1" value="{{ settings.payee_x or 20 }}" oninput="updatePreview()">
                            </div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="payee_y" id="payeeY" placeholder="Y" step="0.1" value="{{ settings.payee_y or 25 }}" oninput="updatePreview()">
                            </div>
                            <div class="col-2">
                                <input type="number" class="form-control form-control-sm" name="payee_fs" id="payeeFS" placeholder="Sz" value="{{ settings.payee_font_size or 11 }}" oninput="updatePreview()">
                            </div>
                        </div>

                        <!-- Words -->
                        <div class="row g-2 mb-2 align-items-end">
                            <div class="col-4"><label class="small fw-bold">Amount (Words)</label></div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="words_x" id="wordsX" placeholder="X" step="0.1" value="{{ settings.amount_words_x or 25 }}" oninput="updatePreview()">
                            </div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="words_y" id="wordsY" placeholder="Y" step="0.1" value="{{ settings.amount_words_y or 35 }}" oninput="updatePreview()">
                            </div>
                            <div class="col-2">
                                <input type="number" class="form-control form-control-sm" name="words_fs" id="wordsFS" placeholder="Sz" value="{{ settings.amount_words_font_size or 10 }}" oninput="updatePreview()">
                            </div>
                        </div>

                        <!-- Digits -->
                        <div class="row g-2 mb-3 align-items-end">
                            <div class="col-4"><label class="small fw-bold">Amount (Digits)</label></div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="digits_x" id="digitsX" placeholder="X" step="0.1" value="{{ settings.amount_digits_x or 140 }}" oninput="updatePreview()">
                            </div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="digits_y" id="digitsY" placeholder="Y" step="0.1" value="{{ settings.amount_digits_y or 35 }}" oninput="updatePreview()">
                            </div>
                            <div class="col-2">
                                <input type="number" class="form-control form-control-sm" name="digits_fs" id="digitsFS" placeholder="Sz" value="{{ settings.amount_digits_font_size or 12 }}" oninput="updatePreview()">
                            </div>
                        </div>

                        <!-- Options -->
                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="is_cross" id="isCross" {% if settings.is_cross_cheque %}checked{% endif %} onchange="updatePreview()">
                                <label class="form-check-label small fw-bold">Print "A/C Payee Only"</label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold">
                            <i class="fas fa-save me-1"></i> Save Configuration
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right: Preview -->
            <div class="col-md-8 mb-4">
                <div class="card shadow-sm h-100 border-0">
                    <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
                        <i class="fas fa-eye me-2"></i> Layout Preview (Scaled)
                    </div>
                    <div class="card-body d-flex justify-content-center align-items-center bg-dark">
                        <!-- Cheque Canvas -->
                        <div id="chequePreview" style="background-color: white; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5);">
                            <!-- Elements -->
                            <div id="prevDate" class="preview-element">DD/MM/YYYY</div>
                            <div id="prevPayee" class="preview-element">Payee Name Here</div>
                            <div id="prevWords" class="preview-element">One Thousand Rupees Only</div>
                            <div id="prevDigits" class="preview-element">1,000.00</div>
                            <div id="prevCross" class="preview-element" style="border-top: 1px solid #000; border-bottom: 1px solid #000; transform: rotate(-45deg); font-size: 10px; text-align: center; width: 80px;">A/C PAYEE ONLY</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
    function updatePreview() {
        // 1mm = approx 3.78px
        const scale = 3.78;

        const width = parseFloat(document.getElementById('paperWidth').value) || 175;
        const height = parseFloat(document.getElementById('paperHeight').value) || 76;

        const preview = document.getElementById('chequePreview');
        preview.style.width = (width * scale) + 'px';
        preview.style.height = (height * scale) + 'px';

        // Helper to position
        function setPos(elId, xId, yId, fsId) {
            const el = document.getElementById(elId);
            const x = parseFloat(document.getElementById(xId).value) || 0;
            const y = parseFloat(document.getElementById(yId).value) || 0;
            const fs = parseFloat(document.getElementById(fsId).value) || 10;

            el.style.left = (x * scale) + 'px';
            el.style.top = (y * scale) + 'px';
            el.style.fontSize = (fs * 1.3) + 'px'; // pt to px approx
            el.style.position = 'absolute';
        }

        setPos('prevDate', 'dateX', 'dateY', 'dateFS');
        setPos('prevPayee', 'payeeX', 'payeeY', 'payeeFS');
        setPos('prevWords', 'wordsX', 'wordsY', 'wordsFS');
        setPos('prevDigits', 'digitsX', 'digitsY', 'digitsFS');

        // Cross Cheque
        const cross = document.getElementById('prevCross');
        const isCross = document.getElementById('isCross').checked;
        cross.style.display = isCross ? 'block' : 'none';
        cross.style.left = '20px'; // Fixed relative pos usually
        cross.style.top = '20px';
    }

    // Init
    window.onload = updatePreview;
</script>
{% endblock %}
