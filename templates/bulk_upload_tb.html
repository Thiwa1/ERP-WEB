{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <!-- Header -->
    <div class="row mb-4">
        <div class="col-12 text-white p-3 rounded shadow-sm" style="background-color: var(--secondary-color);">
            <h4 class="mb-0 text-center fw-bold"><i class="fas fa-file-invoice-dollar me-2"></i> BULK UPLOAD TRIAL BALANCE</h4>
        </div>
    </div>

    <!-- Upload Form -->
    <div class="card shadow-sm mb-4 border-0">
        <div class="card-body bg-light text-center py-5">
            <form method="POST" enctype="multipart/form-data">
                <i class="fas fa-balance-scale-right fa-3x text-muted mb-3"></i>
                <h5 class="mb-3">Select TB Excel or CSV File</h5>
                <p class="text-muted small mb-4">Required Headers: Account Name, Debit, Credit</p>

                <div class="d-flex justify-content-center mb-3">
                    <a href="{{ url_for('download_template', template_type='tb', format='csv') }}" class="btn btn-outline-secondary btn-sm me-2"><i class="fas fa-download me-1"></i> Sample CSV</a>
                    <a href="{{ url_for('download_template', template_type='tb', format='excel') }}" class="btn btn-outline-success btn-sm"><i class="fas fa-download me-1"></i> Sample Excel</a>
                </div>

                <div class="d-flex justify-content-center">
                    <input type="file" name="file" class="form-control w-50" accept=".csv, .xls, .xlsx" required>
                </div>

                <button type="submit" class="btn btn-primary fw-bold mt-4 px-5">
                    <i class="fas fa-check me-2"></i> Upload & Verify
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
