{% extends "base.html" %}

{% block title %}Customer Loyalty Registration{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <!-- Header -->
    <div class="row mb-4">
        <div class="col-12 text-white p-3 rounded shadow-sm" style="background-color: var(--primary-color);">
            <div class="text-center">
                <h4 class="mb-0 fw-bold">Registration of Loyalty customer</h4>
                <small class="text-white-50">Register new loyalty customers and manage their information</small>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-4">
                    <h5 class="text-primary fw-bold mb-4">📋 Customer Information</h5>

                    <form method="POST" action="{{ url_for('customer_loyalty') }}">
                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-3 col-form-label fw-bold text-secondary">Customer Name</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" name="customer_name">
                            </div>
                        </div>

                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-3 col-form-label fw-bold text-secondary">Billing Address</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" name="billing_address">
                            </div>
                        </div>

                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-3 col-form-label fw-bold text-secondary">Delivery Address</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" name="delivery_address">
                            </div>
                        </div>

                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-3 col-form-label fw-bold text-secondary">E-Mail</label>
                            <div class="col-sm-9">
                                <input type="email" class="form-control" name="email">
                            </div>
                        </div>

                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-3 col-form-label fw-bold text-secondary">Mobile No</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" name="mobile_no">
                            </div>
                        </div>

                        <div class="row mb-4 align-items-center">
                            <label class="col-sm-3 col-form-label fw-bold text-secondary">Amount Paid</label>
                            <div class="col-sm-9">
                                <input type="number" step="0.01" class="form-control" name="amount_paid">
                            </div>
                        </div>

                        <!-- Footer Section -->
                        <div class="border-top pt-4">
                            <div class="d-flex justify-content-center mb-4">
                                <button type="submit" class="btn btn-primary px-5 py-2 fw-bold" style="background-color: var(--secondary-color); border: none;">
                                    Submit
                                </button>
                            </div>

                            <div class="row align-items-center bg-light p-3 rounded">
                                <label class="col-sm-3 col-form-label fw-bold text-secondary">Communications:</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control bg-white" readonly value="{{ get_flashed_messages()[-1] if get_flashed_messages() else 'Ready' }}">
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
