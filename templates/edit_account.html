{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0 text-dark"><i class="fas fa-edit me-2 text-primary"></i>Edit Account</h2>
        <a href="/chart_of_accounts" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>Back to Chart of Accounts</a>
    </div>

    <form method="POST" action="/edit_account/{{ account.id }}">
        <!-- Account Type Badges -->
        <div class="card shadow-sm mb-4 border-0">
            <div class="card-header bg-dark text-white fw-bold">
                <i class="fas fa-tags me-2"></i> Account Type (Select one)
            </div>
            <div class="card-body bg-light">
                <div class="d-flex flex-wrap gap-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="account_type" value="income" id="check_income" {% if account.account_income == 1 %}checked{% endif %}>
                        <label class="form-check-label fw-bold" style="color: var(--primary-color);" for="check_income">Income Account</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="account_type" value="expense" id="check_expense" {% if account.account_expenses == 1 %}checked{% endif %}>
                        <label class="form-check-label fw-bold" style="color: var(--primary-color);" for="check_expense">Expenses Account</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="account_type" value="liability" id="check_liability" {% if account.account_liabilities == 1 %}checked{% endif %}>
                        <label class="form-check-label fw-bold" style="color: var(--primary-color);" for="check_liability">Liability Account</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="account_type" value="equity" id="check_equity" {% if account.account_equity == 1 %}checked{% endif %}>
                        <label class="form-check-label fw-bold" style="color: var(--primary-color);" for="check_equity">Equity Account</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="account_type" value="asset" id="check_asset" {% if account.account_assets == 1 %}checked{% endif %}>
                        <label class="form-check-label fw-bold" style="color: var(--primary-color);" for="check_asset">Assets Account</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Left Column: Account Details -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100 border-0">
                    <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
                        <i class="fas fa-info-circle me-2"></i> Account Details
                    </div>
                    <div class="card-body bg-white">
                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Account Name</label>
                            <input type="text" class="form-control" name="account_name" value="{{ account.account_name }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Currency</label>
                            <select class="form-select" name="currency_code">
                                {% for curr in currencies %}
                                <option value="{{ curr.currency_code }}" {% if curr.currency_code == account.currency_code %}selected{% endif %}>{{ curr.currency_code }} - {{ curr.currency_name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted">Basement</label>
                            <input type="text" class="form-control bg-light" value="{{ account.account_basment }}" readonly>
                            <small class="form-text text-muted">Basement (Debit/Credit) is set automatically.</small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Category Selection -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100 border-0">
                    <div class="card-header fw-bold text-white" style="background-color: var(--secondary-color);">
                        <i class="fas fa-list-ul me-2"></i> Category Selection
                    </div>
                    <div class="card-body bg-white">
                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Balance Sheet Category</label>
                            <select class="form-select" name="bs_category">
                                <option value="">Please select</option>
                                {% for cat in bs_categories %}
                                <option value="{{ cat.name_of_category }},{{ cat.holding_position }}" {% if cat.name_of_category == account.account_name_of_catogory_Balace_sheet %}selected{% endif %}>{{ cat.name_of_category }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Income Category (P&L)</label>
                            <select class="form-select" name="income_category">
                                <option value="">Please select</option>
                                {% for cat in pl_categories %}
                                <option value="{{ cat.name_of_category }},{{ cat.holding_position }}" {% if cat.name_of_category == account.account_name_of_catogory_PL %}selected{% endif %}>{{ cat.name_of_category }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: var(--primary-color);">Cash Flow Category</label>
                            <select class="form-select" name="cf_category">
                                <option value="">-- Select Cash Flow Category --</option>
                                {% for cat in cf_categories %}
                                <option value="{{ cat.catogory_name }}" {% if cat.catogory_name == account.cf_catogory %}selected{% endif %}>{{ cat.catogory_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="card shadow-sm border-0">
            <div class="card-body d-flex justify-content-end gap-2 bg-white">
                <button type="submit" class="btn btn-primary fw-bold px-4" style="background-color: var(--accent-color); border: none;">
                    <i class="fas fa-save me-1"></i> Save Changes
                </button>
            </div>
        </div>
    </form>
</div>

<script>
    // Enforce mutual exclusivity for checkboxes
    const checkboxes = document.querySelectorAll('input[name="account_type"]');
    checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', function() {
            if (this.checked) {
                checkboxes.forEach(cb => {
                    if (cb !== this) cb.checked = false;
                });
            }
        });
    });
</script>
{% endblock %}
