{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <h2 class="mb-4"><i class="fas fa-cogs text-primary me-2"></i>POS Settings</h2>

    <form method="POST" action="/pos_settings">
        <div class="row">
            <!-- General Settings -->
            <div class="col-md-6">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-light fw-bold">General Configuration</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Inventory Location</label>
                            <select name="location" class="form-select">
                                <option value="">-- Select --</option>
                                {% for loc in locations %}
                                <option value="{{ loc.inventory_locations_name }}" {% if settings.Select_Inventry_Location == loc.inventory_locations_name %}selected{% endif %}>
                                    {{ loc.inventory_locations_name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Credit Card Control Account</label>
                            <select name="card_ac" class="form-select">
                                <option value="">-- Select --</option>
                                {% for acc in accounts %}
                                <option value="{{ acc.account_name }}" {% if settings.Card_Control_AC == acc.account_name %}selected{% endif %}>
                                    {{ acc.account_name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cash Control Account</label>
                            <select name="cash_ac" class="form-select">
                                <option value="">-- Select --</option>
                                {% for acc in accounts %}
                                <option value="{{ acc.account_name }}" {% if settings.Cash_Account == acc.account_name %}selected{% endif %}>
                                    {{ acc.account_name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pricing & VAT -->
            <div class="col-md-6">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-light fw-bold">Pricing & VAT</div>
                    <div class="card-body">
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" name="market_price" id="marketPrice" {% if settings.Sales_with_market_price == 1 %}checked{% endif %}>
                            <label class="form-check-label" for="marketPrice">Sales with Market Price</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" name="special_price" id="specialPrice" {% if settings.Sales_with_Special_price == 1 %}checked{% endif %}>
                            <label class="form-check-label" for="specialPrice">Sales with Special Price</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" name="loyalty_price" id="loyaltyPrice" {% if settings.Loyalty_Price == 1 %}checked{% endif %}>
                            <label class="form-check-label" for="loyaltyPrice">Loyalty Price Enabled</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" name="vat_enable" id="vatEnable" {% if settings.VAT_Enable == 1 %}checked{% endif %}>
                            <label class="form-check-label" for="vatEnable">VAT Enabled</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Messages -->
            <div class="col-md-12">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-light fw-bold">Receipt Messages</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Top Message</label>
                            <textarea name="top_msg" class="form-control" rows="2">{{ settings.Top_Message }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Footer Message</label>
                            <textarea name="footer_msg" class="form-control" rows="3">{{ settings.Footer_Message }}</textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Save Settings</button>
    </form>
</div>
{% endblock %}
